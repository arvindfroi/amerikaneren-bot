  /* ==========================================================================
     AMERIKANEREN DEMO — stilark
     ==========================================================================

     ============================ IDENTITETEN ==============================

     Bygget på appikonet Arvind leverte: dyp koboltblå, en femtakket stjerne
     fylt med røde og hvite striper, og de fire kortfargene rundt den i blank
     3D. Americana — flagg-rødt, hvitt og blått.

     Det er ikke et temavalg blant mange. Spillet heter Amerikaneren, og
     identiteten skriver seg selv. Tre ting bærer den overalt:

         KOBOLT      grunnfargen. Radialen er MØRKEST I MIDTEN og lysner
                     utover, slik ikonet er — motsatt av den vanlige vignetten,
                     og derfor gjenkjennelig som nettopp dette spillet.
         KORALL      den ENE aksenten. Alt som skal ropes sier det i korall.
         STJERNA     motivet som går igjen: bakgrunnsvannmerke, kortbaksiden,
                     trumfskiltet, stikkvinneren, lasteindikatoren, faviconen.

     ==================== HVA SOM BLE VRAKET, OG HVORFOR ===================

     Forrige runde var filtgrønn med gull. Tilbakemeldingen var at siden så
     «AI-generert» ut, og den kritikken traff: grønn filt er standardvalget for
     ethvert kortspill, gull er standardaksenten, systemfonten er
     standardfonten, og ingenting av det pekte på DETTE spillet. En side kan
     være pen og likevel anonym.

     ==================== FIREFARGESTOKKEN BEHOLDES ========================

     Ikonet bruker to farger: koks for spar og kløver, korall for hjerter og
     ruter. Kortene gjør IKKE det, og det er et bevisst avvik. Hele forrige
     runde handlet om at spar var vanskelig å skille — å slå spar og kløver
     sammen i én farge ville gjeninnført nøyaktig det problemet.

     Løsningen er at tre av de fire fargene likevel kommer rett fra ikonet:

         spar     koks       ikonets mørke
         hjerter  korall     ikonets røde
         ruter    kobolt     ikonets blå
         kløver   grønn      den fjerde, dempet så den ikke slåss med resten

     ================= TO PALETTER PER FARGE, SOM FØR ======================

     `--f` er blekk på hvit kortflate, `--fd` er flateverdi på mørk bakgrunn.
     På mørk flate vises en farge ALDRI som farget tekst, bare som fylt merke
     med nesten svart symbol oppå. Den regelen tok etterlysningsknappene fra
     1,09:1 til 17,40:1 forrige runde, og den nye paletten er valgt slik at
     tallene holder. Målt på nytt etterpå, ikke antatt.
     ====================================================================== */

  :root {
    /* Kobolt, fra ikonet */
    --kobolt-950: #04102c;
    --kobolt-900: #081b45;
    --kobolt-800: #0e2a63;
    --kobolt-700: #164291;
    --kobolt-600: #1f5ec0;
    --kobolt-400: #6d9de6;
    --kobolt-200: #b9d0f5;

    /* Korall — den ene aksenten */
    --korall: #e8503f;
    --korall-lys: #ff8a76;
    --korall-dyp: #b53525;

    --krem: #f7f4ec;
    --kritt: #ffffff;
    --koks: #171b22;

    --tekst: #eef3fc;
    --tekst-2: #b2c6e6;
    --tekst-3: #7f99c4;
    --flate: #071a41;
    --flate-2: #0d2454;
    --kant: #1c407f;
    --kant-lys: #2d5da8;

    --ok: #4ad07f;
    --minus: #ff8a76;
    --rad: 12px;
    --skygge: 0 2px 5px rgba(2,8,24,.5), 0 10px 28px rgba(2,8,24,.55);

    --kortflate: #f9f7f0;

    /* FARGENE PÅ HVIT KORTFLATE. Kontrast mot #f9f7f0:
       spar 16,4:1 · hjerter 5,2:1 · ruter 7,4:1 · kløver 6,0:1 */
    --s-blekk: #171b22;
    --h-blekk: #c3311f;
    --r-blekk: #164291;
    --k-blekk: #256b3a;

    /* FARGENE PÅ MØRK FLATE — brukes som BAKGRUNN i `.fargemerke`,
       med nesten svart symbol oppå. 9–16:1 for alle fire. */
    --s-mork: #edf2fb;
    --h-mork: #ff8a76;
    --r-mork: #86b6ff;
    --k-mork: #74d992;

    --slab: "Alfa Slab One", "Bookman Old Style", Rockwell, Georgia, serif;
    --sans: "Libre Franklin", "Franklin Gothic Medium", "Segoe UI", system-ui, sans-serif;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* MØRKEST I MIDTEN, lysere utover — ikonets egen radial. Den stopper
       godt før hvitt: kortene er kremhvite, og en lys kant ville tatt
       kontrasten deres akkurat der de ligger oftest. */
    background:
      radial-gradient(ellipse 110% 85% at 50% 46%,
        var(--kobolt-950) 0%, var(--kobolt-900) 34%,
        var(--kobolt-800) 62%, var(--kobolt-700) 84%, #1c50a6 100%);
    color: var(--tekst);
    font: clamp(15px, 1.05vh + 0.7vw, 26px)/1.45 var(--sans);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%; height: 100dvh;
    gap: clamp(4px, 0.8vh, 12px);
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    position: relative; z-index: 1;
  }

  #oppleser, .skjult {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  /* Symboldefinisjonene. Ligger UTENFOR `#app` med vilje: appen bygger
     `#app` på nytt med `innerHTML` ved hver tilstandsendring, og en `<defs>`
     der inne ville forsvunnet under føttene på hver `<use>`. */
  .symboler { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ---- Stjerna ----------------------------------------------------------- */
  .stjerne { display: block; width: 1em; height: 1em; }
  /* Vannmerket midt på bordet. Svakt nok til å ikke slåss med kortene, sterkt
     nok til at bordet har et midtpunkt i stedet for å være en tom flate. */
  .vannmerke {
    position: fixed; inset: 0; z-index: 0; pointer-events: none;
    display: grid; place-items: center; overflow: hidden;
  }
  .vannmerke .stjerne {
    width: min(62vh, 62vw); height: min(62vh, 62vw);
    /* Stripene lager vannrett banding hvis merket blir for sterkt. .04 er
       nok til at bordet har et midtpunkt, lavt nok til at et kort som ligger
       oppå det fortsatt leses uten anstrengelse. */
    opacity: .04; filter: blur(.6px);
  }
  @media (max-height: 500px) { .vannmerke .stjerne { width: 46vh; height: 46vh; } }

  /* ---- Fargemerket: den ene måten en farge vises på mørk flate ----------- */
  .fargemerke {
    display: inline-flex; align-items: center; gap: .3em;
    background: var(--fd); color: #0a0f18;
    border-radius: 999px; padding: .06em .55em .12em;
    font-weight: 800; line-height: 1.25; white-space: nowrap;
  }
  .fargemerke .sym { font-size: 1.15em; }
  .f-S { --f: var(--s-blekk); --fd: var(--s-mork); }
  .f-H { --f: var(--h-blekk); --fd: var(--h-mork); }
  .f-R { --f: var(--r-blekk); --fd: var(--r-mork); }
  .f-K { --f: var(--k-blekk); --fd: var(--k-mork); }

  /* ---- Topplinje --------------------------------------------------------- */
  header {
    display: flex; align-items: center; gap: clamp(6px, 1vw, 18px);
    flex-wrap: wrap; row-gap: 6px;
  }
  .poeng { display: flex; gap: clamp(4px, .6vw, 12px); flex-wrap: wrap; min-width: 0; }
  .poeng .spiller {
    background: rgba(4, 14, 38, .55); border: 2px solid var(--kant); border-radius: 10px;
    padding: .18em .6em; display: flex; gap: .5em; align-items: baseline;
    font-size: .82em; line-height: 1.3; transition: border-color .18s, box-shadow .18s;
  }
  .poeng .spiller .navn { color: var(--tekst-2); }
  .poeng .spiller.deg { border-color: var(--korall); }
  .poeng .spiller.deg .navn { color: var(--tekst); }
  .poeng .spiller.itur { border-color: var(--korall); box-shadow: 0 0 0 2px rgba(232,80,63,.34); }
  .poeng b { font-size: 1.5em; color: var(--kritt); font-weight: 800; }
  .poeng .stikk { color: var(--kobolt-200); font-weight: 700; }

  .kontrakt {
    display: flex; align-items: center; gap: .45em; flex-wrap: wrap;
    font-size: .95em; font-weight: 700;
    background: rgba(4, 14, 38, .55); border: 2px solid var(--kant);
    border-radius: 10px; padding: .18em .7em;
  }
  .kontrakt .hvem { color: var(--tekst-2); font-weight: 600; }
  .runde { margin-left: auto; color: var(--tekst-3); font-size: .8em; text-align: right; }

  /* ---- Bordet: RUTENETT, ikke absolutt plassering ------------------------ */
  .bord {
    position: relative; min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: 1fr minmax(0, auto) 1fr;
    grid-template-rows: 1fr minmax(0, auto) 1fr;
    place-items: center;
    gap: clamp(2px, .8vh, 10px);
  }
  .bordkort { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .bordkort .hvem {
    font-weight: 700; font-size: .72em; text-shadow: 0 2px 4px rgba(0,0,0,.7);
    white-space: nowrap; color: var(--tekst-2);
    display: inline-flex; align-items: center; gap: .3em;
  }
  .bordkort .vant { color: var(--korall-lys); display: inline-flex; align-items: center; gap: .25em; }
  .bordkort .vant .stjerne { width: .9em; height: .9em; }
  .bordkort.topp    { grid-area: 1 / 2; align-self: start; }
  .bordkort.venstre { grid-area: 2 / 1; }
  .bordkort.høyre   { grid-area: 2 / 3; }
  .bordkort.bunn    { grid-area: 3 / 2; align-self: end; }
  .midtfelt { grid-area: 2 / 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  .trumfskilt {
    display: flex; align-items: center; gap: .5em;
    background: rgba(4, 14, 38, .72); border: 2px solid var(--kant-lys);
    border-radius: 999px; padding: .2em .8em .2em .55em; font-size: .82em; font-weight: 700;
  }
  .trumfskilt .stjerne { width: 1.15em; height: 1.15em; }
  .trumfskilt .merkelapp { color: var(--tekst-3); font-weight: 600; letter-spacing: .06em; font-size: .9em; }
  .etterlyst {
    display: flex; align-items: center; gap: .4em; flex-wrap: wrap; justify-content: center;
    background: rgba(4, 14, 38, .72); border: 2px solid var(--kant);
    border-radius: 999px; padding: .18em .75em; font-size: .78em;
  }
  .etterlyst .merkelapp { color: var(--tekst-3); }
  .dintur {
    background: var(--korall); color: #fff; font-weight: 800;
    border-radius: 999px; padding: .25em 1em; font-size: .8em;
    box-shadow: 0 3px 16px rgba(232,80,63,.4);
  }

  .tenker {
    display: inline-flex; align-items: center; gap: .5em;
    background: rgba(4, 14, 38, .82); border: 2px solid var(--kant-lys);
    border-radius: 999px; padding: .25em .9em; font-size: .8em; font-weight: 600;
  }
  .tenker.topp { grid-area: 1 / 2; align-self: end; }
  .tenker.venstre { grid-area: 2 / 1; }
  .tenker.høyre { grid-area: 2 / 3; }
  .tenker.bunn { grid-area: 3 / 2; align-self: start; }
  .prikker { display: inline-flex; gap: 3px; }
  .prikker i { width: .32em; height: .32em; border-radius: 50%; background: var(--korall-lys);
               animation: hopp 1.1s ease-in-out infinite; }
  .prikker i:nth-child(2) { animation-delay: .16s; }
  .prikker i:nth-child(3) { animation-delay: .32s; }
  @keyframes hopp { 0%, 60%, 100% { opacity: .3; transform: translateY(0); }
                    30% { opacity: 1; transform: translateY(-.28em); } }

  .forrige {
    position: absolute; right: 0; top: 0; z-index: 2;
    background: rgba(4, 14, 38, .74); border: 2px solid var(--kant);
    border-radius: 10px; padding: .3em .5em; text-align: center;
    font-size: .62em; max-width: 42%;
  }
  .forrige .tittel { color: var(--tekst-3); margin-bottom: 2px; white-space: nowrap; }
  .forrige .tittel b { color: var(--korall-lys); }
  .forrige .rad { display: flex; gap: 3px; justify-content: center; }
  .forrige .navn { color: var(--tekst-3); font-size: .9em; }

  /* ---- Kort --------------------------------------------------------------
     EKTE KORTPROPORSJONER: 2,5 × 3,5 tommer, altså 0,714. Sto på 0,7 før —
     nær nok til å se riktig ut, ikke nær nok til å VÆRE riktig. */
  .kort {
    width: var(--kb, var(--kort-maks));
    aspect-ratio: 2.5 / 3.5;
    background:
      linear-gradient(160deg, #fffefb 0%, var(--kortflate) 46%, #efece2 100%);
    color: var(--f, var(--s-blekk));
    border: 1px solid rgba(23,27,34,.28); border-radius: clamp(5px, .8vh, 10px);
    position: relative; cursor: pointer; padding: 0; flex: 0 0 auto;
    font: inherit; box-shadow: var(--skygge);
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }
  .kort .hjorne {
    position: absolute; top: 3.5%; left: 6%; text-align: center;
    font-weight: 800; font-size: clamp(14px, calc(.34 * var(--kb, 90px)), 42px);
    line-height: .96; letter-spacing: -.03em;
  }
  .kort .hjorne .sym { display: block; font-size: .96em; letter-spacing: 0; }
  .kort .hjorne.ned { top: auto; left: auto; bottom: 3.5%; right: 6%; transform: rotate(180deg); }
  .kort .midt {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: clamp(19px, calc(.56 * var(--kb, 90px)), 74px);
    /* Blank 3D-kjensle, som fargene i ikonet — lys ovenfra, ikke flatt. */
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.85)) drop-shadow(0 2px 3px rgba(23,27,34,.28));
  }
  @media (max-width: 430px) { .kort .hjorne.ned { display: none; } }

  .kort:not([disabled]):hover { transform: translateY(-.9vh) scale(1.04); box-shadow: 0 12px 30px rgba(2,8,24,.65); }
  .kort:not([disabled]):active { transform: translateY(-.3vh) scale(.99); }
  .kort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 3px; z-index: 3; }
  .kort:not([disabled]):focus-visible { transform: translateY(-.9vh) scale(1.04); }
  .kort[disabled] { opacity: .42; filter: saturate(.35); cursor: default; }
  .hånd.passiv .kort[disabled] { opacity: .92; filter: none; }
  .bordkort .kort[disabled], .forrige .kort[disabled], .rygg.kort { opacity: 1; filter: none; }
  .kort.valgt { outline: 4px solid var(--korall-lys); outline-offset: 2px; transform: translateY(-1.4vh); z-index: 2; }
  .kort.liten { --kb: clamp(44px, 4.6vw + 3.2vh, 96px); }
  .forrige .kort { --kb: clamp(26px, 3.4vh, 44px); border-width: 1px; box-shadow: none; }

  /* KORTBAKSIDEN. Stjerna på kobolt, med en tynn kremramme slik ekte
     kortrygger har. Brukes til motstandernes bunker og på startskjermen. */
  .kort.rygg {
    background:
      radial-gradient(ellipse at 50% 45%, var(--kobolt-700) 0%, var(--kobolt-900) 72%, var(--kobolt-950) 100%);
    border-color: rgba(247,244,236,.5); cursor: default;
    display: grid; place-items: center;
  }
  .kort.rygg::before {
    content: ""; position: absolute; inset: 7%;
    border: 1px solid rgba(247,244,236,.34); border-radius: 3px;
  }
  .kort.rygg .stjerne { width: 54%; height: 54%; opacity: .95; }

  /* Motstandernes bunker: bordet er en kortbord, ikke en tom flate. */
  .bunke { display: flex; flex-direction: column; align-items: center; gap: 3px; }
  .bunke .vifte { display: flex; }
  .bunke .vifte .kort { --kb: clamp(20px, 2.4vw + 1.6vh, 44px); margin-left: -42%; box-shadow: 0 2px 6px rgba(2,8,24,.6); }
  .bunke .vifte .kort:first-child { margin-left: 0; }
  .bunke .antall {
    font-size: .62em; color: var(--tekst-3); font-weight: 700; white-space: nowrap;
    display: inline-flex; align-items: center; gap: .4em;
  }
  /* Når det er dette setets tur, bytter tallet plass med «tenker …». Samme
     linje, samme sted — bunken og bobla hører til samme spiller. */
  .bunke .antall .prikker i { background: var(--korall-lys); }

  /* ---- Hånden ------------------------------------------------------------ */
  :root { --kort-maks: clamp(56px, 7.2vw + 3.6vh, 132px); --kort-min: 46px; --kort-luft: 4px; }
  .hånd {
    display: flex; justify-content: center; align-items: flex-end;
    flex-wrap: wrap; gap: var(--kort-luft);
    padding: 2px 0 4px; min-height: 0;
  }
  .hånd .kort {
    --kb: clamp(
      var(--kort-min),
      calc((100% - (var(--n, 13) - 1) * var(--kort-luft)) / var(--n, 13)),
      var(--kmaks, var(--kort-maks))
    );
  }

  /* ---- ANIMASJONER -------------------------------------------------------
     ARVIND: «det kan gå litt for raskt når vi spiller og vi får ikke med oss
     ting.» Dette er derfor en LESBARHETSFIKS, ikke pynt, og den er tidsatt
     etter det: et kort skal kunne følges med øynene fra den som la det, og et
     stikk skal kunne ses gå til den som vant det.

     Kortet glir inn FRA sin egen kant av bordet, så retningen forteller hvem
     som la det. `prefers-reduced-motion` slår alt av — da står kortene bare
     der, og frysepausen alene gjør jobben. */
  .bordkort .kort.ny { animation: legges .42s cubic-bezier(.22,.9,.3,1) both; }
  .bordkort.topp    .kort.ny { animation-name: fra-topp; }
  .bordkort.bunn    .kort.ny { animation-name: fra-bunn; }
  .bordkort.venstre .kort.ny { animation-name: fra-venstre; }
  .bordkort.høyre   .kort.ny { animation-name: fra-hoyre; }
  @keyframes legges     { from { opacity: 0; transform: scale(.86); } }
  @keyframes fra-topp    { from { opacity: 0; transform: translateY(-190%) rotate(-7deg) scale(.9); } }
  @keyframes fra-bunn    { from { opacity: 0; transform: translateY(190%)  rotate(6deg)  scale(.9); } }
  @keyframes fra-venstre { from { opacity: 0; transform: translateX(-210%) rotate(-9deg) scale(.9); } }
  @keyframes fra-hoyre   { from { opacity: 0; transform: translateX(210%)  rotate(9deg)  scale(.9); } }

  .bordkort.vant .kort { outline: 3px solid var(--korall-lys); outline-offset: 2px; }
  /* Innsamlingen til vinneren. Flyttingen settes som inline `transform` fra
     app.ts, som måler de faktiske posisjonene — 16 kombinasjoner av vinner og
     plass ville ellers måttet skrives ut for hånd, og de ville vært gjetninger
     om et rutenett som endrer seg med skjermstørrelsen. */
  .bord.samler .bordkort .kort {
    transition: transform .62s cubic-bezier(.4,0,.2,1), opacity .62s ease;
  }
  .bord.samler .bordkort .hvem { transition: opacity .3s; opacity: 0; }
  .bord.samler .bordkort.vant .hvem { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .overlegg.fersk, .overlegg.fersk .panel, .bordkort .kort.ny { animation: none; }
    .bord.samler .bordkort .kort { transition: none; }
    .prikker i { animation: none; opacity: .8; }
    .kort { transition: none; }
    .laster .stjerne { animation: none !important; }
  }

  /* ---- Paneler ----------------------------------------------------------- */
  .overlegg {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 12px;
    background: rgba(2, 8, 24, .42);
  }
  .overlegg.fersk { animation: tone .16s ease-out; }
  .overlegg.fersk .panel { animation: opp .18s ease-out; }
  @keyframes tone { from { opacity: 0; } }
  @keyframes opp { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  .panel {
    background: linear-gradient(180deg, var(--flate-2) 0%, var(--flate) 100%);
    border: 2px solid var(--kant-lys); border-radius: 18px;
    padding: clamp(14px, 2.4vh, 30px) clamp(16px, 2.6vw, 36px);
    width: fit-content; min-width: min(280px, 92vw);
    max-width: min(96vw, 900px); max-height: min(94vh, 94dvh); overflow: auto;
    box-shadow: 0 20px 64px rgba(2,8,24,.8); text-align: center;
    position: relative;
  }
  /* Korallstripe langs toppen — flaggets røde, og et sted for aksenten som
     ikke stjeler oppmerksomhet fra knappene. */
  .panel::before {
    content: ""; position: absolute; left: 0; right: 0; top: 0; height: 4px;
    background: linear-gradient(90deg, var(--korall-dyp), var(--korall), var(--korall-lys));
    border-radius: 18px 18px 0 0;
  }
  .panel h1 { font-family: var(--slab); font-weight: 400; font-size: clamp(1.5em, 3.4vh, 2.3em);
              margin: 0 0 .3em; letter-spacing: .01em; line-height: 1.05; }
  .panel h2 { font-size: clamp(1.05em, 2vh, 1.4em); margin: 0 0 .7em; line-height: 1.3; font-weight: 800; }
  .knapper { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  button.stor {
    font: inherit; font-size: clamp(.95em, 1.7vh, 1.25em); font-weight: 800;
    min-width: 3.4em; min-height: 48px; padding: .45em .95em;
    border-radius: var(--rad); border: 2px solid var(--kant-lys); cursor: pointer;
    background: var(--kobolt-700); color: #fff; touch-action: manipulation;
    transition: background .14s, transform .1s, box-shadow .14s;
  }
  button.stor:hover { background: var(--kobolt-600); }
  button.stor:active { transform: translateY(1px) scale(.985); }
  button.stor:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 2px; }
  button.stor[disabled] { opacity: .38; cursor: default; }
  button.stor[disabled]:hover { background: var(--kobolt-700); }
  button.pass { background: #4a2320; border-color: #8a4a42; }
  button.pass:hover { background: #6a322c; }
  button.spesial { background: var(--korall-dyp); border-color: var(--korall); }
  button.spesial:hover { background: var(--korall); }
  button.bekreft { background: var(--korall); border-color: var(--korall-lys);
                   font-size: clamp(1.05em, 2vh, 1.45em); }
  button.bekreft:hover { background: var(--korall-lys); color: #2a0d08; }

  /* ---- Trumfvelgeren: fire KORT ------------------------------------------ */
  .trumfvalg { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.6vw, 18px); justify-content: center; }
  button.trumfkort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(160deg, #fffefb 0%, var(--kortflate) 100%); color: var(--f);
    border: 2px solid rgba(247,244,236,.35); border-radius: var(--rad);
    padding: 0; overflow: hidden;
    width: clamp(84px, 17vw, 150px); min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
    box-shadow: var(--skygge);
    transition: transform .14s, box-shadow .14s, border-color .14s;
  }
  button.trumfkort .stripe { display: block; width: 100%; height: 10px; background: var(--f); }
  button.trumfkort .tsym {
    font-size: clamp(30px, 6vh, 56px); line-height: 1; margin-top: .18em;
    filter: drop-shadow(0 1px 0 rgba(255,255,255,.9)) drop-shadow(0 2px 3px rgba(23,27,34,.3));
  }
  button.trumfkort .tnavn { font-size: clamp(13px, 1.7vh, 19px); font-weight: 800; color: #3a3f46; margin-bottom: .45em; }
  button.trumfkort:hover { transform: translateY(-4px); box-shadow: 0 14px 32px rgba(2,8,24,.7); border-color: var(--korall-lys); }
  button.trumfkort:active { transform: translateY(-1px) scale(.99); }
  button.trumfkort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 3px; }

  /* ---- Etterlysningen: MINIKORT ------------------------------------------ */
  .etterlysrad { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: .6em 0 1em; }
  button.minikort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(160deg, #fffefb 0%, var(--kortflate) 100%); color: var(--f);
    border: 1px solid rgba(23,27,34,.28); border-radius: 8px;
    min-width: 48px; min-height: 60px; padding: .2em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    font-weight: 800; box-shadow: 0 2px 7px rgba(2,8,24,.5);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  button.minikort .v { font-size: clamp(17px, 2.3vh, 24px); }
  button.minikort .sym { font-size: clamp(15px, 2vh, 22px); }
  button.minikort:hover { transform: translateY(-3px); border-color: var(--korall); box-shadow: 0 9px 20px rgba(2,8,24,.6); }
  button.minikort:active { transform: translateY(0) scale(.98); }
  button.minikort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 2px; }

  .vrakhånd { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1em; }
  .vrakhånd .kort { --kb: clamp(48px, 4.6vw + 3.4vh, 104px); }

  .bekreftlinje { font-size: clamp(1em, 2vh, 1.3em); margin: .5em 0 .2em; line-height: 1.6; }
  .bekreftsmatt { opacity: .78; font-size: .82em; margin: 0 0 1em; color: var(--tekst-2); font-weight: 400; }

  .resultat h2 { font-size: clamp(1.05em, 2.2vh, 1.5em); }
  .delta { display: flex; gap: clamp(8px, 2vw, 24px); justify-content: center;
           font-size: clamp(.9em, 1.8vh, 1.2em); margin-bottom: 1.2em; flex-wrap: wrap; }
  .delta .pluss { color: var(--ok); } .delta .minus { color: var(--minus); }
  .lite { font-size: .72em; color: var(--tekst-3); } .lite a { color: var(--kobolt-200); }

  /* ---- Startskjermen ----------------------------------------------------- */
  .start .ordmerke {
    font-family: var(--slab); font-weight: 400;
    font-size: clamp(28px, 6.4vh, 58px); line-height: 1; letter-spacing: .005em;
    color: var(--krem); margin: 0;
    text-shadow: 0 2px 0 var(--korall-dyp), 0 4px 18px rgba(2,8,24,.7);
  }
  .start .ordmerke .demo {
    display: block; font-family: var(--sans); font-weight: 800;
    font-size: .3em; letter-spacing: .32em; text-transform: uppercase;
    color: var(--korall-lys); text-shadow: none; margin-top: .5em;
  }
  /* Tre kortrygger i vifte over ordmerket — motivet som hero, og eneste
     stedet baksiden vises stort. */
  .kortvifte { display: flex; justify-content: center; margin-bottom: .7em; }
  .kortvifte .kort { --kb: clamp(46px, 9vh, 78px); margin-left: -18%; }
  .kortvifte .kort:first-child { margin-left: 0; transform: rotate(-13deg); }
  .kortvifte .kort:last-child { transform: rotate(13deg); }
  .start input {
    font: inherit; font-size: 1.05em; padding: .5em .8em; border-radius: 10px;
    border: 2px solid var(--kant-lys); background: rgba(2,8,24,.55); color: #fff;
    margin: .5em 0 1.1em; width: 14em; max-width: 100%; min-height: 48px; text-align: center;
  }
  .start input::placeholder { color: var(--tekst-3); }
  .start input:focus-visible { outline: 3px solid var(--korall-lys); outline-offset: 2px; border-color: var(--korall); }
  .start label { display: block; color: var(--tekst-2); font-size: .85em; }
  .start p { color: var(--tekst-2); font-size: .9em; margin: .2em 0 1em; }

  /* Lasteindikatoren: tre stjerner som slår, ikke en generisk stripe. */
  .laster { display: flex; flex-direction: column; align-items: center; gap: .9em; }
  .laster .stjerner { display: flex; gap: .5em; }
  .laster .stjerne { width: 1.6em; height: 1.6em; animation: blink 1.25s ease-in-out infinite; }
  .laster .stjerne:nth-child(2) { animation-delay: .18s; }
  .laster .stjerne:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 65%, 100% { opacity: .22; transform: scale(.86); }
                     32% { opacity: 1; transform: scale(1.04); } }

  ul.regler { text-align: left; margin: 0 auto 1em; padding-left: 1.1em; max-width: 34em;
              color: var(--tekst-2); font-size: .82em; }
  ul.regler li { margin-bottom: .3em; }

  /* ================= LAV SKJERM = LIGGENDE TELEFON =======================
     Står SIST i fila med vilje: regler som skal overstyre må komme etter det
     de overstyrer, ellers taper de på lik spesifisitet. */
  @media (max-height: 500px) {
    .kort.liten { --kb: clamp(34px, 9vh, 60px); }
    .bordkort .hvem { font-size: .58em; }
    .trumfskilt { display: none; }
    .etterlyst, .dintur, .tenker { font-size: .66em; }
    .midtfelt { gap: 3px; }
    .forrige { display: none; }
    .bunke { display: none; }
  }
  @media (max-width: 560px) { .forrige { font-size: .55em; max-width: 54%; } }
</style>
</head>
