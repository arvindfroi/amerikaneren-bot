   * og hvite), og forskjellen var så liten at man måtte gjette hvilke som
   * var lovlige.
   *
   * INGEN AV KORTENE ER GJENNOMSIKTIGE LENGER. Hele forskjellen bæres av tre
   * ting som er lov i dette designet:
   *
   *   HØYDE   det lovlige kortet står 2 vh høyere enn de andre. Det er den
   *           samme bevegelsen en hånd gjør når den skyver fram et kort, og
   *           det er den ene forskjellen som overlever at kortene overlapper.
   *   LYS     en korallkant langs overkanten av det lovlige — nøyaktig den
   *           kanten løftet gjør synlig. Her sto en bred korallglød UNDER
   *           kortet først, og den var feil av en grunn som bare synes i
   *           nettleseren: kortene i en vifte ligger oppå hverandre, så
   *           gløden landet på NABOENS hvite kortflate og så ut som en
   *           rødlig flekk på et kort som ikke var valgt. En innskygge kan
   *           ikke bløde ut på naboen.
   *   SKALA   det ulovlige krymper 4 %. Kortflaten er like hvit og like
   *           lesbar — den ligger bare lenger unna.
   */
  .hjul .kort[disabled] {
    pointer-events: none;
    transform: scale(.96);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--korttykk), var(--fall-1);
  }
  .hjul .kort:not([disabled]) {
    transform: translateY(-2vh) scale(1.05);
    box-shadow:
      inset 0 5px 0 -1px var(--korall),
      inset 1px 1px 0 #fff,
      var(--korttykk),
      var(--fall-3);
  }
  /* «passiv» = kortene er ikke valgbare fordi et panel har ordet, ikke fordi
     de er ulovlige. Da skal de stå rolig og fullt lesbare — ingen av dem er
     «feil», så ingen av dem skal trekke seg tilbake. */
  .hjul.passiv .kort[disabled] { transform: none; box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--korttykk), var(--fall-2); }
  /* ============ REKKEFØLGEN PÅ DISSE FIRE ER IKKE TILFELDIG =============
     `.hjul .kort:not([disabled])` over har nøyaktig samme spesifisitet som
     `.kort:not([disabled]):hover` lenger oppe i fila, og en senere regel
     vinner ved likhet. Uten disse fire ville hviletilstanden slått ut både
     pekeren, tastaturfokuset og fingeren som holder kortet — altså ville
     kortet stått bom stille uansett hva man gjorde med det. */
  .hjul .kort:not([disabled]):hover,
  .hjul .kort:not([disabled]):focus-visible { transform: translateY(-3.4vh) scale(1.1); }
  .hjul .kort:not([disabled]):active { transform: translateY(-1.2vh) scale(1.02); }
  .hjul .kort.griper {
    z-index: 60 !important; transform: translateY(-2vh) scale(1.08);
    box-shadow: inset 0 5px 0 -1px var(--korall), inset 1px 1px 0 #fff, var(--korttykk), var(--fall-3);
  }
  /* Passert kastegrensen: kortet lyser opp, og bordet svarer. Her ER den
     brede gløden riktig — kortet er løftet ut av vifta og har ingen nabo å
     søle på lenger.

     `rotateX` LEGGER KORTET NED mens det føres mot bordet. Det er den ene
     bevegelsen som gjør kastet til et objekt i rommet i stedet for et bilde
     som blir større: flaten vipper mot bordplanet den er på vei til, akkurat
     som kortene som alt ligger der (`.motspiller .kortplass`, 29°). */
  .hjul .kort.kaster {
    transform: translateY(-2vh) rotateX(22deg) scale(1.13);
    box-shadow: inset 1px 1px 0 #fff, var(--glo-korall), var(--fall-3);
  }

  /* PILENE. «Røde piler ytterst til venstre og høyre for å bla.» De ligger
     OVER viftekantene, slik de er tegnet, og er egne knapper — den som ikke
     vil sveipe skal slippe å lære en gest for å spille kort. */
  /* PILENE er i skissen store, myke røde piler som ligger rett på flaten —
     ingen knappeflate rundt, ingen ramme. Trykkflaten er likevel 48 px+, som
     er kravet; den er bare usynlig. */
  /* Pilene står NÅ I HVER SIN SPALTE i `.handrad`-rutenettet, ikke oppå
     viftekantene. De beholder trykkflaten sin; det er bare vifta som ikke
     lenger må dele plass med dem. */
  .blapil {
    position: relative; z-index: 8;
    width: clamp(44px, 4.8vw, 72px); height: clamp(56px, 11vh, 118px);
    display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 0; border-radius: 999px; touch-action: manipulation;
    background: none;
    transition: opacity .2s var(--myk), transform .16s var(--sprett), filter .18s var(--myk);
    filter: drop-shadow(3px 5px 10px rgba(10,26,110,.55));
  }
  .blapil .pil { display: block; width: 100%; height: 100%; }
  .blapil.hoyre .pil { transform: scaleX(-1); }
  .blapil:hover:not([disabled]) { filter: drop-shadow(4px 7px 14px rgba(10,26,110,.6)) brightness(1.08); }
  .blapil:active:not([disabled]) { transform: scale(.92); }
  .blapil:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
  /* Låst hånd (alt får plass): pilene forsvinner, men spalten står igjen slik
     at vifta ikke bytter bredde i det siste kortet spilles. */
  .blapil[disabled] { opacity: 0; pointer-events: none; }

  /* Kasteflaten: bordet svarer mens et kort dras opp mot det. */
  .bord.tarimot { outline: 3px dashed rgba(255,138,118,.55); outline-offset: -6px; border-radius: var(--rad-l); }

  /* ================== ANIMASJONER =======================================
     ARVIND: «de animasjonene for utspill er også ikke polert, og det viser
     aldri hvem som får stikket med en animasjon.»

     Det første er tempo og easing. Det andre var en ekte feil, og den er
     verdt å skrive ned: kortene GLED til vinneren, men de landet OPPÅ
     hverandre under vinnerens eget kort og falmet til 0,5 — så det som
     faktisk ble sett var at kortene forsvant, ikke at de gikk et sted. En
     måling som sa «408 px flyttet» var sann og svarte likevel ikke på om noen
     så det.

     Nå LANDER de: bunken legger seg i vifte rundt vinnerens kort, i full
     dekkevne, med en liten støt-effekt når den treffer. Og etterpå spretter
     et stikkmerke ut av bunken og flyr inn i lagbaren, slik at man ser stikket
     bli til framdrift mot kontrakten. */
  /* Motstanderens kort faller ned FRA HAM; ditt eget kastes opp fra hånden.
     Retningen er nå gitt av hvor spilleren sitter, ikke av en plassklasse. */
  .bordkort .kort.ny { animation: legges .44s var(--sprett) both; }
  .motspiller .bordkort .kort.ny { animation-name: fra-eier; }
  .dinplass   .bordkort .kort.ny { animation-name: fra-haanden; }
  @keyframes legges     { from { opacity: 0; transform: scale(.86); } }
  @keyframes fra-eier    { from { opacity: 0; transform: translateY(-160%) rotate(-8deg) scale(.86); } }
  @keyframes fra-haanden { from { opacity: 0; transform: translateY(210%)  rotate(7deg)  scale(.86); } }

  /* Stikket er avgjort: vinnerkortet løftes og lyser, taperne trekker seg
     tilbake. Forskjellen skal kunne ses fra sofaen, ikke leses. */
  /* TAPERNE TREKKER SEG TILBAKE — de blekner IKKE. Her sto `filter:
     brightness(.68) saturate(.7)`, altså tre kort med grå kortflate, og det
     er den samme feilen som `opacity` på hånden: en kortflate som ikke er
     hvit ser ut som en feil. Avstand og skygge gjør jobben i stedet. */
  .bord.avgjort .bordkort:not(.vant) .kort {
    transform: scale(.86) translateY(3%);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--korttykk), var(--fall-1);
  }
  .bord.avgjort .bordkort:not(.vant) .hvem { opacity: .35; }
  .bordkort.vant .kort {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), var(--glo-korall), var(--loft-3);
    animation: vinnerslag .62s var(--sprett) both;
    z-index: 4;
  }
  @keyframes vinnerslag {
    0% { transform: scale(1); }
    42% { transform: scale(1.16) translateY(-4%); }
    100% { transform: scale(1.08) translateY(-2%); }
  }
  /* Setet lyser opp der stikket havner. */
  .seteglans {
    position: absolute; left: 50%; top: 50%; width: 260%; height: 260%;
    transform: translate(-50%, -50%); pointer-events: none; z-index: -1;
    background: radial-gradient(circle at 50% 50%,
      rgba(232,80,63,.42) 0%, rgba(232,80,63,.16) 34%, rgba(232,80,63,0) 66%);
    animation: glans .95s var(--myk) both;
  }
  @keyframes glans {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    45% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: .55; transform: translate(-50%, -50%) scale(1); }
  }
  /* Vinnerskiltet står OVER kortet, ikke bak det. Før vokste kortet opp i sin
     egen etikett og dekket halve ordet. */
  .vinnerband {
    display: inline-flex; align-items: center; gap: .35em;
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 60%, #86180d 100%);
    color: #fff; font-weight: 800; font-size: .92em; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 999px; padding: .16em .7em .2em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 16px rgba(232,80,63,.6);
    animation: band-inn .5s var(--sprett) both;
    position: relative; z-index: 5;
  }
  .vinnerband .stjerne { width: .95em; height: .95em; }
  @keyframes band-inn { from { opacity: 0; transform: translateY(6px) scale(.6); } }

  /* Innsamlingen. Flyttingen settes som inline `transform` fra app.ts, som
     måler de faktiske posisjonene — seksten kombinasjoner av vinner og plass
     ville ellers vært gjetninger om et rutenett som endrer seg med skjermen. */
  .bord.samler .bordkort .kort {
    transition: transform .52s var(--ut-inn), opacity .3s ease .5s;
  }
  .bord.samler .bordkort .hvem { transition: opacity .3s; opacity: 0; }
  .bord.samler .bordkort.vant .hvem { opacity: 1; }
  .bord.samler .bordkort.vant .kort { animation: none; }
  /* Støtet når bunken lander. */
  .bord.landet .bordkort.vant .kort { animation: nedslag .38s var(--sprett) both; }
  @keyframes nedslag {
    0% { transform: scale(1.08) translateY(-2%); }
    40% { transform: scale(1.18) translateY(-1%); }
    100% { transform: scale(1.06) translateY(-2%); }
  }

  /* Stikkmerket som flyr fra bunken inn i lagbaren. */
  .flygemerke {
    position: fixed; z-index: 40; pointer-events: none;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2em; height: 2em; padding: 0 .5em;
    border-radius: 999px; font: 800 clamp(14px, 2vh, 22px)/1 var(--sans);
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 60%, #86180d 100%);
    color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 24px rgba(232,80,63,.7);
  }
  /* `.lagbar` og `.brikke` sto her og traff ingenting: begge klassene forsvant
     da lagstikk-baren ble byttet ut, og regelen ble stående igjen. Treffet
     ligger nå på `.fyll` og `.stikksoyle`, som er det som faktisk finnes. */
  @keyframes treffslag {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .overlegg.fersk, .overlegg.fersk .panel, .bordkort .kort.ny,
    .kontraktlinje.inn, .dintur, .dintur.inn,
    .forrige.inn, .vinnerband,
    .seteglans, .tavle .itur::after, .tavle b.endret,
    .medaljong.kommer, .stikksoyle .tall.slag,
    .gjennombrudd .bolge, .gjennombrudd .lyn, .gjennombrudd .rop,
    .bordkort.vant .kort, .bord.landet .bordkort.vant .kort,
    .rom .skinn, .laster .stjerne, .prikker i, .stikksoyle .treff, .fyll.treff,
    /* Runde 6: startskjermens svevende ikonformer. Budtavla og budstripa
       står ikke lenger i lista — begge klassene forsvant da budene flyttet
       inn i spillernes egne celler i topplinja. */
    .ikonlag .fig {
      animation: none !important;
    }
    .bord.samler .bordkort .kort { transition: none; }
    .kort, .bordkort .hvem, .stikksoyle, .fyll, .hakkene { transition: none; }
    /* Ikonformene skal fortsatt STÅ der de står, bare uten svevet. Uten denne
       faller hele ikonet fra hverandre: plasseringen ligger i den SAMME
       `transform`-en som animasjonen overstyrer, så `animation: none` alene
       hadde etterlatt fem former stablet i sitt eget øvre venstre hjørne. */
    .ikonlag .fig { transform: translate(-50%, -50%); }
    /* Gjennombruddet skal fortsatt SES — det er rundens avgjørelse — men det
       står stille i stedet for å slå. Ropet blir stående til neste tegning. */
    .gjennombrudd .bolge { display: none; }
    .gjennombrudd .lyn { opacity: 1; }
    .gjennombrudd .rop { opacity: 1; transform: translateY(-50%); }
    /* Hjulet skal fortsatt kunne blas — det er navigasjon, ikke pynt. Men
       det skjer uten glid: kortet står der det skal med én gang. */
    .hjul .kort { transition: none; }
    .seteglans { opacity: .55; }
  }

  /* ================== PANELER ============================================ */
  /* HVER SKJERM ARVER SIGNATUREN. Her sto et mørkt slør — det er den vanlige
     modal-oppskriften, og den gjorde at startskjermen, budpanelet og
     rundeoppgjøret så ut som en annen app enn bordet. */
  .overlegg {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 12px;
    background: var(--rom-fall-slor);
    backdrop-filter: blur(5px);
  }
  /* ============ HÅNDEN SKAL SES MENS MAN BYR ===========================
     ARVIND: «man ser ikke kortene sine ordentlig før man byr.»

     Det er ikke en pyntefeil, det er en feil i spillflyten: hele
     avgjørelsen — hvor høyt tør jeg by, hvilken farge er lengst — leses av
     hånden, og panelet lå oppå den med et sløret heldekkende lag.

     `.apen` er derfor et overlegg som BARE dekker toppen: ingen bakgrunn,
     ingen uskarphet, og høyden er panelets egen. Alt under panelet er
     synlig og kan blas i mens man tenker. Panelet svelger sine egne trykk
     (`pointer-events`), så et bomtrykk ved siden av gjør ingenting galt.

     Kortene er `disabled` i denne fasen fra før — de er ikke spillbare, bare
     lesbare — og `.hjul.passiv` gjør at ingen av dem ser «forbudte» ut. */
  /* ============ PANELET FLYTTET FRA TOPPEN TIL BORDFLATEN ==============
     ARVIND, punkt 8: «"ditt bud" dekker Lincoln. ingen boble skal legge seg
     over en motstander eller over kortene.»

     Her sto `inset: 0 0 auto 0` med `align-items: start` — altså festet til
     toppen av skjermen, som er nøyaktig der de tre motstanderne sitter. At
     panelet ikke hadde bakgrunn hjalp ikke: det er selve FLATEN som ligger
     oppå Lincoln.

     Nå står det i den tomme bordflaten mellom kortene på bordet og hånden
     din: festet til BUNNEN, løftet nøyaktig `--handhoyde` opp så det ikke
     rører kortene heller. Den høyden måles i `oppdaterHjul()` — se der for
     hvorfor den ikke kan skrives her.

     Begge kravene er dermed geometriske, ikke skjønnsmessige: over kortene er
     umulig fordi bunnkanten ligger over dem, og over motstanderne er umulig
     fordi panelet er bundet til bunnen og har `max-height`. */
  .overlegg.apen {
    inset: auto 0 calc(var(--handhoyde, 200px) + clamp(6px, 1.2vh, 16px)) 0;
    height: auto;
    background: none; backdrop-filter: none;
    align-items: end; pointer-events: none;
    padding-top: 0;
  }
  .overlegg.apen .panel {
    pointer-events: auto;
    /* Taket er strengere enn før (60 % → 44 %) fordi panelet nå vokser
       OPPOVER fra bunnen. Uten det kunne to rader budknapper på en lav
       skjerm rekke helt opp i motstanderne igjen — altså punkt 8 tilbake,
       bare fra den andre kanten. */
    max-height: min(44vh, 44dvh);
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.9), 0 0 0 1px rgba(9,20,80,.18), var(--fall-3);
  }
  .overlegg.fersk { animation: tone .2s ease-out; }
  .overlegg.fersk .panel { animation: opp .34s var(--sprett); }
  @keyframes tone { from { opacity: 0; } }
  @keyframes opp { from { opacity: 0; transform: translateY(16px) scale(.94); } }
  .panel {
    background: var(--panelflate); color: var(--paa);
    border: 0; border-radius: clamp(18px, 3vh, 32px);
    padding: clamp(16px, 2.8vh, 32px) clamp(18px, 2.8vw, 40px);
    width: fit-content; min-width: min(280px, 92vw);
    max-width: min(96vw, 900px); max-height: min(94vh, 94dvh); overflow: auto;
    /* Lyset oppe til venstre, skyggen ned til høyre — samme regel som alt
       annet. Korallstripa langs toppen er strøket: den var en hard kant i et
       design der ingenting har harde kanter. */
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.9), var(--innskygge), var(--fall-3);
    text-align: center; position: relative;
  }
  .panel h1 { font-family: var(--slab); font-weight: 400; font-size: clamp(1.5em, 3.4vh, 2.3em);
              margin: 0 0 .3em; letter-spacing: .01em; line-height: 1.05; }
  .panel h2 { font-size: clamp(1.05em, 2vh, 1.4em); margin: 0 0 .7em; line-height: 1.3; font-weight: 800; }
  .knapper { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  /* KNAPPENE ER OGSÅ LYSE. Tallbudene leser nå som små kortflater — mørkt
     siffer på hvitt — i stedet for hvite tall i mørkeblå bokser. De to som
     BETYR noe utover et tall (Amerikaner, Solo) og bekreftelsen beholder
     korallen, slik at fargen fortsatt bare brukes der den sier noe. */
  button.stor {
    font: inherit; font-size: clamp(.95em, 1.7vh, 1.25em); font-weight: 800;
    min-width: 3.4em; min-height: 48px; padding: .45em .95em;
    border-radius: var(--rad); border: 0; cursor: pointer;
    background: var(--flate-hev);
    color: var(--paa); touch-action: manipulation;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.95), var(--innskygge), var(--fall-1);
    transition: transform .14s var(--sprett), box-shadow .18s var(--myk), filter .18s var(--myk);
  }
  button.stor:hover { filter: brightness(1.04); box-shadow: inset 1px 1px 0 rgba(255,255,255,.95), var(--fall-2); transform: translateY(-2px); }
  button.stor:active { transform: translateY(1px) scale(.985); box-shadow: inset 0 2px 5px rgba(40,70,140,.28); }
  button.stor:focus-visible { outline: 4px solid var(--korall); outline-offset: 2px; }
  button.stor[disabled] { opacity: .4; cursor: default; }
  button.stor[disabled]:hover { filter: none; transform: none; }
  /* Pass er et VALG om å ikke gjøre noe, og skal ikke rope. Dempet flate,
     fortsatt mørk tekst. */
  button.pass { background: linear-gradient(var(--lysfall), #f3e6e2 0%, #e6d2cb 100%); color: #5a2419; }
  button.spesial { background: linear-gradient(var(--lysfall), #e8402b 0%, #a51f11 100%); color: #fff;
                   box-shadow: inset 1px 1px 0 rgba(255,255,255,.4), var(--fall-1); }
  button.bekreft {
    background: linear-gradient(var(--lysfall), #e8402b 0%, #b52314 52%, #86180d 100%);
    color: #fff; font-size: clamp(1.05em, 2vh, 1.45em);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), var(--fall-2);
  }

  /* ---- Trumfvelgeren: fire KORT ------------------------------------------ */
  .trumfvalg { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.6vw, 18px); justify-content: center; }
  button.trumfkort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(var(--lysfall), #ffffff 0%, var(--kortflate) 100%); color: var(--f);
    border: 0; border-radius: var(--rad);
    padding: 0; overflow: hidden;
    width: clamp(84px, 17vw, 150px); min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.95), var(--fall-2);
    transition: transform .18s var(--sprett), box-shadow .18s var(--myk);
  }
  button.trumfkort .stripe { display: block; width: 100%; height: 10px; background: var(--f); }
  button.trumfkort .tsym {
    display: block; width: clamp(46px, 8vh, 82px); height: clamp(46px, 8vh, 82px);
    margin-top: .1em;
  }
  button.trumfkort .tsym svg { display: block; width: 100%; height: 100%; }
  button.trumfkort .tnavn { font-size: clamp(13px, 1.7vh, 19px); font-weight: 800; color: #3a3f46; margin-bottom: .45em; }
  button.trumfkort:hover { transform: translateY(-6px) scale(1.03); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), var(--loft-3), 0 0 0 1px rgba(255,138,118,.5); }
  button.trumfkort:active { transform: translateY(-1px) scale(.99); }
  button.trumfkort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 3px; }

  /* ---- Etterlysningen: MINIKORT ------------------------------------------ */
  .etterlysrad { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: .6em 0 1em; }
  button.minikort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(var(--lysfall), #ffffff 0%, var(--kortflate) 100%); color: var(--f);
    border: 0; border-radius: 9px;
    min-width: 48px; min-height: 60px; padding: .2em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--loft-1);
    transition: transform .16s var(--sprett), box-shadow .16s var(--myk);
  }
  button.minikort .v { font-size: clamp(17px, 2.3vh, 24px); }
  button.minikort .sym { font-size: clamp(15px, 2vh, 22px); }
  button.minikort:hover { transform: translateY(-5px) scale(1.04); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--loft-2), 0 0 0 1px rgba(255,138,118,.55); }
  button.minikort:active { transform: translateY(0) scale(.98); }
  button.minikort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 2px; }

  .vrakhånd { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1em; }
  .vrakhånd .kort { --kb: clamp(48px, 4.6vw + 3.4vh, 104px); }

  .bekreftlinje { font-size: clamp(1em, 2vh, 1.3em); margin: .5em 0 .9em; line-height: 1.6; }
  .bekreftsmatt { font-size: .82em; color: var(--paa-2); font-weight: 500; }
  h2 .bekreftsmatt { display: block; margin-top: .25em; }

  /* Utfallet av runden: form og farge, ikke et emoji. */
  .utfall {
    display: inline-flex; align-items: center; gap: .4em;
    border-radius: 999px; padding: .12em .8em .16em; font-size: .78em;
    font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), var(--loft-1);
  }
  .utfall.ja { background: linear-gradient(180deg, #63e39a 0%, #2f9c5f 100%); color: #04240f; }
  .utfall.nei { background: linear-gradient(180deg, var(--korall-lys) 0%, var(--korall-dyp) 100%); color: #fff; }

  .resultat h2 { font-size: clamp(1.05em, 2.2vh, 1.5em); }
  .resultat h2 .stjerne { display: inline-block; width: .9em; height: .9em; vertical-align: -.06em; margin: 0 .3em; }
  .resultat h2 .utfall { vertical-align: .1em; }
  .delta { display: flex; gap: clamp(8px, 2vw, 24px); justify-content: center;
           font-size: clamp(.9em, 1.8vh, 1.2em); margin: 1em 0 1.2em; flex-wrap: wrap; }
  .delta span { display: inline-flex; gap: .4em; align-items: baseline; }
  .delta .pluss b { color: #146b3c; } .delta .minus b { color: var(--korall-dyp); }
  .delta .navn { color: var(--paa-3); font-size: .84em; }
  .lite { font-size: .72em; color: var(--paa-3); } .lite a { color: var(--kobolt-900); }

  /* ================== STARTSKJERMEN: APPIKONET I FULLSKJERM ==============
     ARVIND, punkt 10. Se `startskjerm()` i app.ts for hva dette erstatter og
     hvorfor. Kort: et ikon har ingen boks — det ER flaten. */
  .ikonstart {
    background: none; backdrop-filter: none;
    display: grid; place-items: center; overflow: hidden;
  }
  .ikonlag { position: absolute; inset: 0; pointer-events: none; }
  /* DE FEM FORMENE, i ikonets egne posisjoner. Målene er lest av
     `web/konsept/appikon.png`, ikke funnet på: kløver oppe til venstre,
     ruter oppe til høyre og størst av de fire, stjerna i midten, hjerter
     nede til venstre, spar nede til høyre og nest størst.

     Enheten er `min(1vw, 1vh)`-aktig via `min(100vw, 100vh)`, slik at
     ikonet beholder sine PROPORSJONER på en høy telefon i stedet for å bli
     strukket. Et ikon som er strukket er ikke det samme ikonet. */
  .ikonlag .fig {
    position: absolute; display: block;
    width: calc(var(--s, 20) * min(100vw, 100vh) / 100);
    height: calc(var(--s, 20) * min(100vw, 100vh) / 100);
    left: calc(var(--x) * 1%); top: calc(var(--y) * 1%);
    transform: translate(-50%, -50%);
    animation: sveve var(--t, 17s) ease-in-out infinite;
    animation-delay: var(--f, 0s);
  }
  .ikonlag .kloever { --x: 22; --y: 19; --s: 20; --t: 19s; --f: -3s; }
  .ikonlag .ruter   { --x: 80; --y: 16; --s: 24; --t: 23s; --f: -9s; }
  .ikonlag .hjerter { --x: 13; --y: 79; --s: 26; --t: 21s; --f: -14s; }
  .ikonlag .spar    { --x: 87; --y: 84; --s: 30; --t: 25s; --f: -6s; }
  /* Bordkanten hører til spillet, ikke til ikonet — se `startskjerm()`. */
  body.paa-start .rom .bordkant { display: none; }
  /* STJERNA er det eneste som lyser i ikonet, og den står i midten. Den
     puster i stedet for å sveve — «animert bittelitt», ikke i bevegelse. */
  .ikonlag .stjerna {
    --x: 50; --y: 38; --s: 46;
    animation: stjernepust 11s ease-in-out infinite;
  }
  /* «ANIMERT BITTELITT.» Utslaget er under to prosent av skjermen og
     perioden er tjue sekunder — man skal kjenne at flaten LEVER uten å kunne
     peke på hva som beveger seg. Blir den større, blir den en skjermsparer. */
  @keyframes sveve {
    0%, 100% { transform: translate(-50%, -50%) rotate(0deg); }
    33% { transform: translate(-50%, calc(-50% - 1.4%)) rotate(1.6deg); }
    66% { transform: translate(calc(-50% + 1%), calc(-50% + 1.1%)) rotate(-1.2deg); }
  }
  @keyframes stjernepust {
    0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: .96; }
    50% { transform: translate(-50%, -50%) scale(1.045); opacity: 1; }
  }
  .startinnhold {
    position: relative; z-index: 1;
    display: flex; flex-direction: column; align-items: center;
    gap: clamp(12px, 2.4vh, 26px);
    padding: 0 16px; max-width: 100%;
    /* Innholdet står i NEDRE halvdel, slik at stjerna eier midten som i
       ikonet. `margin-top` og ikke `justify-content`, fordi feltet skal bli
       stående når tastaturet på en telefon krymper visningsområdet. */
    margin-top: 34vh;
  }
  .ordmerke {
    font-family: var(--slab); font-weight: 400;
    /* ============ ORDMERKET GIKK UT AV SKJERMEN =======================
       Målt på 390 px: «Amerikaneren» i 54 px Alfa Slab One er rundt 400 px
       bredt, altså bredere enn telefonen. Ordet ble klippet etter «Amerikaner».
       Høyden alene kan ikke bestemme skriftstørrelsen på en tekst som skal
       stå på ÉN linje — bredden må være med i regnestykket. */
    font-size: min(clamp(28px, 6.4vh, 58px), 11.2vw);
    line-height: 1; letter-spacing: .005em; white-space: nowrap;
    color: var(--krem); margin: 0;
    text-shadow: 0 2px 0 var(--korall-dyp), 0 4px 18px rgba(2,8,24,.7);
  }
  /* «DEMO» STO I KORALL, og korall på koboltbakgrunnen måler 2,48:1 — langt
     under gulvet for 13 px sperret tekst. Ordet er hvitt nå og måler 4,77:1.
     Korallen er ikke borte: den ligger som en glød rundt bokstavene, der den
     gir aksenten uten å bære lesbarheten. En skygge teller ikke som kontrast,
     og skal derfor heller ikke gjøre jobben til en tekstfarge. */
  .ordmerke .demo {
    display: block; font-family: var(--sans); font-weight: 800;
    font-size: .3em; letter-spacing: .32em; text-transform: uppercase;
    color: #fff; margin-top: .55em;
    text-shadow: 0 0 12px rgba(242,56,44,.95), 0 0 3px rgba(242,56,44,.8), 0 1px 6px rgba(2,8,24,.8);
  }
  .bromelding { margin: 0; font-size: .8em; color: var(--kobolt-200); }
  .startinnhold input {
    font: inherit; font-size: 1.05em; padding: .5em .8em; border-radius: var(--rad-s);
    border: 0;
    background: linear-gradient(var(--lysfall), #ffffff 0%, #eef4ff 100%);
    box-shadow: inset 2px 2px 7px rgba(40,70,140,.22);
    color: var(--paa);
    margin: 0; width: 13em; max-width: 100%; min-height: 52px; text-align: center;
    transition: box-shadow .2s var(--myk);
  }
  .startinnhold input::placeholder { color: var(--paa-3); }
  .startinnhold input:focus-visible { outline: none;
    box-shadow: inset 0 2px 6px rgba(40,70,140,.22), 0 0 0 3px rgba(242,56,44,.55); }
  .startinnhold .bekreft { min-width: 8em; }
  /* Lav skjerm (liggende telefon): stjerna eier ikke midten lenger, for da
     er det ikke plass til både den og feltet. Innholdet flyttes opp og
     figurene trekker seg ut i kantene. */
  @media (max-height: 560px) {
    .startinnhold { margin-top: 12vh; gap: clamp(8px, 1.6vh, 14px); }
    .ikonlag .stjerna { --y: 30; --s: 34; }
    .startinnhold input { min-height: 44px; }
  }

  /* Lasteindikatoren: tre stjerner som slår, ikke en generisk stripe. */
  .laster { display: flex; flex-direction: column; align-items: center; gap: .9em; }
  .laster .stjerner { display: flex; gap: .5em; }
  .laster .stjerne { width: 1.6em; height: 1.6em; animation: blink 1.25s ease-in-out infinite; }
  .laster .stjerne:nth-child(2) { animation-delay: .18s; }
  .laster .stjerne:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 65%, 100% { opacity: .22; transform: scale(.86); }
                     32% { opacity: 1; transform: scale(1.04); } }

  /* Utrullingsvarselet. Se `<script>` nederst i fila. */
  #versjonsvarsel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: linear-gradient(180deg, var(--korall) 0%, var(--korall-dyp) 100%);
    color: #fff; font: 600 14px/1.4 var(--sans); text-align: center;
    padding: 10px 14px; box-shadow: 0 -4px 20px rgba(0,0,0,.5);
  }

  /* ================= LAV SKJERM = LIGGENDE TELEFON =======================
     Står SIST i fila med vilje: regler som skal overstyre må komme etter det
     de overstyrer, ellers taper de på lik spesifisitet. */
  /* =====================================================================
     ============ LIGGENDE TELEFON ER EN EGEN KOMPOSISJON ================
     =====================================================================

     ARVIND, runde 7: liggende telefon er «skikkelig dårlig».

     Runde 4 flagget formatet og gikk videre. Siden har fire runder lagt på
     perspektiv, større søyle og et kamera bygget for 390×844 STÅENDE, og alt
     sammen har gjort 844×390 trangere. En layout som bare skaleres ned fra
     stående kan ikke virke her, for de to formatene har MOTSATT knapphet:

         stående 390×844    høyde i overflod, bredde er dyrt
         liggende 844×390   bredde i overflod, høyde er dyrt

     Alt i denne blokken følger av den ene setningen. Regelen er: det som er
     stablet i høyden skal stå ved siden av hverandre, og det som får stå i
     bredden skal få lov til å bruke den.

     MÅLT PÅ 844×390 FØR OMLEGGINGEN:
        topplinja           62 px = 16 % av høyden, i to etasjer
        stikksøyla        160 px høy — bare bordraden — 12,3 px per hakk
        motstanderne      560 av 718 px brede, altså klumpet i midten
        bordkortene        35 px, mot 75 px på hånden
        forrige stikk     skjult

     ---- 1. TOPPLINJA LEGGER SEG PÅ TVERS ------------------------------
     Poengbrettet og kontraktlinja er to etasjer i stående, fordi bredden er
     knapp der. Her er den ikke: de står ved siden av hverandre, og enheten er
     fortsatt ÉN sentrert flate. 62 px → 34 px. */
  @media (max-height: 500px) {
    .statustavle { flex-direction: row; align-items: stretch; }
    /* Skillet må bytte kant når retningen bytter — ellers står streken tvers
       over der de to nå møtes side om side. */
    .kontraktlinje {
      box-shadow: inset 1px 0 0 rgba(62,94,164,.2);
      padding: .1em .7em; font-size: .74em;
    }
    .tavle .spiller { padding: .1em .5em .14em; min-width: 2.7em; }
    .tavle .navn { font-size: .5em; }

    /* ---- 2. SØYLA FÅR HELE HØYDEN, IKKE BARE BORDRADEN ---------------
       I stående er bordraden nesten hele skjermen, så det spilte ingen rolle
       at søyla bare dekket den. Her var den 160 px av 390, og hvert hakk ble
       12,3 px — under det man kan telle. Nå spenner den rad 2 OG rad 3, altså
       forbi hånden, og hånden gir fra seg den bredden den ikke trenger. */
    #app > .stikksoyle { grid-row: 2 / 4; }
    #app > .handrad { grid-column: 1; }
    .stikksoyle { width: clamp(58px, 8vw, 96px); margin-left: clamp(26px, 3vw, 44px); }

    /* ---- 3. SETENE SITTER BREDT --------------------------------------
       78 % av bordet er riktig i stående: der klumper de tre seg sammen på
       den andre siden av bordet, som i skissen. Her er bredden det man har
       mest av, og tre hoder i midten av en 844 px skjerm etterlater to store
       tomme flater i hjørnene. */
    .motstandere { width: min(100%, 96%); gap: clamp(0px, 1.4vw, 22px); }
    .motspiller .kortplass { margin-top: clamp(2px, 1.2vh, 10px); }
    .motspiller .medaljong { --mstr: clamp(26px, 7.6vh, 46px); }
    .motspiller .igjen { display: none; }

    /* ---- 4. KORTENE PÅ BORDET STO IKKE I FORHOLD ---------------------
       35 px mot 75 px på hånden er 0,47 — det utspilte kortet leste som et
       ikon. Her er de 47 px, altså 0,63 av håndkortet.

       TAKET ER REGNET, IKKE VALGT. Bordraden må romme hodet, navnet,
       motstandernes kort OG ditt eget kort under dem, og den er 195 px høy i
       dette formatet. Med 13vh ble summen 200 px, og ditt eget kort rant ned
       i håndraden — målt 1 325 px² overlapp mot kortene på hånden, altså
       nøyaktig blokkeringen denne runden begynte med, i det ene formatet den
       ikke var meldt fra. 12vh gir 189 px og et gulv på 6 px. */
    .kort.liten { --kb: clamp(34px, 11vh, 56px); }
    .tomplass { --tomb: clamp(34px, 11vh, 56px); }
    .bordkort .hvem { font-size: .58em; }
    .dinplass { margin-bottom: clamp(3px, 1vh, 8px); }
    /* SETERADEN MÅ GI FRA SEG DE SISTE PIKSLENE. Målt: seteraden ble 142 px
       og ditt eget kort 66 px av en bordflate på 195 — summen gikk 13 px
       over, og kortet rant ned i håndraden. Navnet, mellomrommene og
       nedskyvingen av bordkortene er de tre stedene det finnes luft å hente
       uten å gjøre noe mindre lesbart. */
    .motspiller { gap: 0; }
    .motspiller .navn { font-size: clamp(9px, .5em, 15px); padding: .1em .55em .12em; }
    .motspiller .kortplass { margin-top: 0; }

    .midtfelt { padding-top: 0; gap: 3px; }
    .dintur { font-size: .66em; }

    /* ---- 5. FORRIGE STIKK BLIR STÅENDE BORTE -------------------------
       Og det er et VALG med et tall bak: loddrett langs venstre kant er den
       190 px høy, altså halve skjermen; vannrett er den 190 px bred, altså
       den plassen søyla og setene nettopp fikk. På en skjerm der høyden er
       den knappe ressursen er forrige stikk den ene opplysningen man kan
       klare seg uten — den sier hva som ALT er skjedd. */
    .forrige { display: none; }
    .rom .stjerne { width: 22vh; height: 22vh; }
  }
  /* ============ NÅR SØYLEN IKKE HAR PLASS TIL MEDALJONGENE UTENFOR =======
     På smale skjermer flytter fjesene INN i sitt eget sonehjørne i stedet
     for å henge utenfor. Ingenting forsvinner — det er nettopp poenget: uten
     fjeset ville sonen bare vært en farge, og farge alene skal aldri være
     eneste skille. */
  @media (max-width: 760px) {
    .stikksoyle { margin-left: 0; width: clamp(40px, 12vw, 68px); }
    /* Ikke plass til fjesene UTENFOR søylen: de flytter inn i løpet. Der
       står de MIDTSTILT og UNDER stikktallet — ikke i samme hjørne som det.
       Målt: to fjes side om side i hjørnet er 60 px bredt i en søyle som er
       47 px, så de dekket både hverandre og tallet. Nå ligger de på rekke med
       et lite overlapp, som en lagstabel, og tallet står fritt over dem. */
    .stikksoyle .medaljongstabel {
      right: auto; left: 50%; transform: translateX(-50%); flex-direction: row;
    }
    .stikksoyle .medaljongstabel.topp { top: clamp(22px, 4.4vw, 30px); }
    .stikksoyle .medaljongstabel.bunn { bottom: clamp(22px, 4.4vw, 30px); }
    .stikksoyle .medaljongstabel { gap: 0; }
    .stikksoyle .medaljongstabel .medaljong + .medaljong { margin-left: -6px; }
    /* Bare målene, ingen ny `box-shadow`: ringbredden er en variabel nettopp
       for at denne regelen skal kunne krympe den uten å skrive skyggen om. */
    .medaljong { --mstr: clamp(14px, 3.8vw, 22px); --ringbredde: 2px; }
    .stikksoyle .tall { font-size: clamp(11px, 3vw, 15px); }
    .gjennombrudd .rop { font-size: clamp(11px, 3vw, 15px); padding: .2em .7em .26em; }
  }
  @media (max-width: 560px) {
    .forrige { font-size: .54em; max-width: 40%; }
    .runde { display: none; }
    .tavle .spiller { padding: .2em .45em .24em; min-width: 2.9em; }
    .motspiller .navn { font-size: clamp(9px, 2.6vw, 13px); letter-spacing: .04em; }
    .blapil { width: 38px; height: clamp(50px, 9vh, 76px); }
    /* ============ DE UTSPILTE KORTENE INN MOT MIDTEN ===================
       ARVIND: «legg de utspilte kortene lenger inn mot midten av skjermen, i
       hvert fall på iPhone. de ligger for langt ut i kanten.»
       De tre setene delte hele bredden likt, så Franklins og Trumps kort lå
       klemt mot hver sin skjermkant. Nå tar raden 82 % av bredden og står
       midtstilt — samme rekkefølge, samme perspektiv, bare samlet. */
    .motstandere { width: 82%; gap: 2px; }
  }
</style>
</head>
<body>
  <!-- ROMMET. Tre lag som til sammen gir dybde uten å bli et møbel: lyset
       ovenfra, bunngløden der kortene lander, og stjerna som identitet. -->
  <div class="rom" aria-hidden="true">
    <div class="skinn"></div>
    <div class="bordkant"></div>
    <div class="grunn"></div>
    <svg class="stjerne" viewBox="0 0 100 100"><use href="#stjernemerke"></use></svg>
  </div>
  <div id="app"></div>
  <div id="oppleser" role="status" aria-live="polite"></div>

  <!-- Stjerna, definert én gang. Femtakket, fylt med flaggets røde og hvite
       striper, med koboltkontur — motivet fra appikonet. -->
  <svg class="symboler" aria-hidden="true" focusable="false">
    <defs>
      <!-- ================= AIRBRUSHEN ==================================
           ARVIND, om konseptkunsten: «gradients og lighting som skiller seg
           ut fra det seriøse designet vi har nå.»

           Ikonet hans er ikke flate ikoner. Kortfargene er OPPBLÅSTE — myk
           radial med lyskilde oppe til venstre, mørk underside, runde
           kanter. Som ballonger, ikke som symboler. Tre runder med frontend
           laget flate glyffer fordi det er standardinstinktet; disse
           gradientene er hele forskjellen.

           Brennpunktet står på 33 %/24 % i ALLE fire, slik at lyset kommer
           fra samme kant overalt. Er lyskilden ulik fra figur til figur,
           faller 3D-illusjonen sammen med én gang. -->
      <!-- ============ HARDHETEN ER HELE POENGET ======================
           Første forsøk på å treffe ikonet bommet på nøyaktig én ting, og
           den ene tingen var ikke farge eller motiv: det var KANTEN. Det ble
           skarp 3D med blank høylysflekk og neonkontur — samme motiv, samme
           palett, feil estetikk.

           I Arvinds ikon har figurene INGEN kontur. Lyset kommer inn oppe
           til venstre som en myk overgang tvers over formen, ikke som en
           speilflekk, og selve kanten er litt UTE AV FOKUS. Det er myk
           pensel på lerret, ikke en rendret modell.

           Derfor: skrå lineærgradient (ikke radial med brennpunkt), ingen
           `stroke`, og `feGaussianBlur` på FIGUREN SELV. Uskarpheten er ikke
           en glødeeffekt lagt utenpå — den er formens egen kant. -->
      <linearGradient id="g-koks" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#8f8f8f"></stop>
        <stop offset=".3" stop-color="#5c5c5c"></stop>
        <stop offset=".72" stop-color="#3a3a3a"></stop>
        <stop offset="1" stop-color="#252525"></stop>
      </linearGradient>
      <linearGradient id="g-korall" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#ffa79c"></stop>
        <stop offset=".3" stop-color="#fb6f60"></stop>
        <stop offset=".72" stop-color="#f2382c"></stop>
        <stop offset="1" stop-color="#cf2b20"></stop>
      </linearGradient>
      <linearGradient id="g-kobolt" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#a8c6ff"></stop>
        <stop offset=".3" stop-color="#5f8bf0"></stop>
        <stop offset=".72" stop-color="#2b4fdd"></stop>
        <stop offset="1" stop-color="#16309e"></stop>
      </linearGradient>
      <linearGradient id="g-gronn" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#a9e6bd"></stop>
        <stop offset=".3" stop-color="#5cc07d"></stop>
        <stop offset=".72" stop-color="#2a8f4c"></stop>
        <stop offset="1" stop-color="#15602f"></stop>
      </linearGradient>

      <!-- ============ MYKHET SOM LYS, IKKE SOM EFFEKT ==================
           En form er myk fordi den er RUND og lyset faller på den — ikke
           fordi den har fått et slørfilter. Uskarpheten her er liten (1,0 på
           en 100-enheters flate) og gjør bare det en malt kant gjør: slutter
           uten å kutte. Skru den opp, og figuren blir en glødeeffekt.

           `feDisplacementMap`-rufsen som lå her er FJERNET. Den etterlignet
           at Arvinds skisse er tegnet fort, og det er en begrensning ved
           skissen — ikke stilen. Ikonet er utført godt, og det er ikonet som
           setter nivået. -->
      <filter id="mykkant" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="1"></feGaussianBlur>
      </filter>
      <!-- Den diffuse gløden rundt STJERNA. Den er den ENESTE formen som
           gløder, og det er med vilje: i ikonet lyser stjerna, mens
           kortfargene bare er belyst. Gløder alt, betyr gløden ingenting. -->
      <filter id="diffus" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="6.5"></feGaussianBlur>
      </filter>
      <filter id="uskarpstripe" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.1"></feGaussianBlur>
      </filter>

      <pattern id="flaggstriper" width="100" height="13.4" patternUnits="userSpaceOnUse">
        <rect width="100" height="6.7" fill="#e8503f"></rect>
        <rect y="6.7" width="100" height="6.7" fill="#f9f7f0"></rect>
      </pattern>
      <!-- STJERNA slik den FAKTISK er i ikonet: stripene har nesten uskarpe
           overganger, og rundt ligger en lys blå glød som siver utover. Ingen
           strek, ingen neonrør — bare en uskarp kopi av formen bak den. -->
      <path id="stjerneform"
            d="M50 3 L61.5 34.3 L95.2 35.6 L68.5 55.9 L78 88.5 L50 69.4 L22 88.5 L31.5 55.9 L4.8 35.6 L38.5 34.3 Z"></path>
      <g id="stjernemerke">
        <use href="#stjerneform" fill="#7fb2ff" filter="url(#diffus)" opacity=".9"></use>
        <use href="#stjerneform" fill="#cfe2ff" filter="url(#uskarpstripe)"></use>
        <use href="#stjerneform" fill="url(#flaggstriper)" filter="url(#uskarpstripe)"></use>
      </g>

      <!-- ============ KORTFARGENE, MYKE OG UTEN KONTUR ================
           Brukes STORT midt på kortflaten. Hjørneindeksen beholder den flate
           glyffen i blekkfargen: en uskarp gradient på 12 piksler blir grøt,
           og det er hjørnet som bærer lesbarheten når hånden ligger i vifte.
