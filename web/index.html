<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a1f12">
<title>Amerikaneren mot botene</title>
<style>
  /* ==========================================================================
     AMERIKANEREN — stilark
     ==========================================================================

     ÉN LAYOUT FOR PC, IPAD OG TELEFON. Ingen egen mobilside, ingen faste
     piksler i det som skal skalere. Alt som bestemmer størrelse går gjennom
     `clamp()` med både en vh- og en vw-komponent, slik at LIGGENDE TELEFON —
     der høyden er 390 px og bredden 844 — får de samme reglene som en TV.
     Liggende telefon er den formfaktoren som pleier å glippe, og den er
     grunnen til at ingenting her måles i `vh` alene.

     ======================= SPARPROBLEMET, OG HVA DET VAR ==================

     Arvind: «når du velger trumf og etterlyser kort så er ikke spar så lett
     å se.»

     Årsaken var ikke at fargene manglet. Firefargestokken var på plass, men
     paletten var laget for HVITE KORTFLATER og så gjenbrukt som TEKSTFARGE
     på mørk bakgrunn: spar `#1a1a1a` skrevet oppå panelets `rgba(8,16,10,.94)`
     gir en kontrast på ca. 1,2:1. Det er ikke «vanskelig å se», det er
     usynlig. Kløver `#2e7d32` lå på 2,1:1 — også under kravet.

     Derfor har hver farge nå TO verdier:

         --f    blekket, til bruk på den hvite kortflaten
         --fd   flateverdien, til bruk PÅ MØRK BAKGRUNN

     og én ufravikelig regel: **på mørk flate vises en farge aldri som farget
     tekst, men som et fylt merke** (`.fargemerke`) med fargen som BAKGRUNN og
     nesten svart symbol oppå. Da er kontrasten den samme for alle fire, og
     spar blir lysest av dem i stedet for mørkest.

     OG ALDRI FARGE ALENE. Hvert sted en farge vises står symbolet der også,
     og der det er plass står navnet. Fargen er en snarvei for den som ser
     den, aldri den eneste bæreren av informasjonen.
     ====================================================================== */

  :root {
    color-scheme: dark;

    --gull: #ffd76a;
    --tekst: #f3f6ef;
    --dempet: #a8bfa2;
    --filt-1: #17402a;
    --filt-2: #0b2415;
    --filt-3: #061109;
    --flate: rgba(7, 20, 12, .94);
    --flate-2: #12291c;
    --kant: #2f5540;
    --kant-lys: #47775c;
    --pluss: #79e58b;
    --minus: #ff8f86;
    --rad: 14px;
    --skygge: 0 2px 4px rgba(0,0,0,.35), 0 8px 24px rgba(0,0,0,.45);

    /* Kortflaten */
    --kortflate: #fbfbf4;

    /* FARGENE PÅ HVIT KORTFLATE (blekk). Kontrast mot #fbfbf4:
       spar 16,8:1 · hjerter 5,1:1 · ruter 6,1:1 · kløver 5,3:1 */
    --s-blekk: #15161a;
    --h-blekk: #c62222;
    --r-blekk: #1259b8;
    --k-blekk: #1f7a33;

    /* FARGENE PÅ MØRK FLATE. Brukes som BAKGRUNN i `.fargemerke`, med nesten
       svart symbol oppå — kontrast 11–14:1 for alle fire. Spar er lys her,
       ikke mørk, og det er hele poenget. */
    --s-mork: #e8ecf5;
    --h-mork: #ff8a80;
    --r-mork: #6fb6ff;
    --k-mork: #62d97e;

    --typo: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;

    /* Kortstørrelse. Både vh og vw, så liggende telefon ikke faller ut. */
    --kort-maks: clamp(56px, 7.2vw + 3.6vh, 132px);
    --kort-min: 46px;
    --kort-luft: 4px;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background:
      radial-gradient(ellipse 120% 90% at 50% 22%, var(--filt-1) 0%, var(--filt-2) 55%, var(--filt-3) 100%);
    color: var(--tekst);
    font: clamp(15px, 1.05vh + 0.7vw, 26px)/1.45 var(--typo);
    font-variant-numeric: tabular-nums;
    /* `overflow:hidden` er et SIKKERHETSNETT, ikke løsningen. Layouten under
       er laget for å ikke flyte over i det hele tatt; testen i
       `skudd.mjs` måler scrollWidth mot clientWidth i hver formfaktor og i
       hvert steg, nettopp fordi et skjult overløp ellers ikke synes. */
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  #app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%;
    height: 100dvh;
    gap: clamp(4px, 0.8vh, 12px);
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
  }

  #oppleser, .skjult {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }

  /* ---------- Fargemerket: den ene måten en farge vises på mørk flate ----- */
  .fargemerke {
    display: inline-flex; align-items: center; gap: .3em;
    background: var(--fd); color: #0a0f0c;
    border-radius: 999px; padding: .06em .55em .12em;
    font-weight: 800; line-height: 1.25; white-space: nowrap;
    vertical-align: baseline;
  }
  .fargemerke .sym { font-size: 1.15em; }
  .f-S { --f: var(--s-blekk); --fd: var(--s-mork); }
  .f-H { --f: var(--h-blekk); --fd: var(--h-mork); }
  .f-R { --f: var(--r-blekk); --fd: var(--r-mork); }
  .f-K { --f: var(--k-blekk); --fd: var(--k-mork); }

  /* ---------- Topplinje --------------------------------------------------- */
  header {
    display: flex; align-items: center; gap: clamp(6px, 1vw, 18px);
    flex-wrap: wrap; row-gap: 6px;
  }
  .poeng { display: flex; gap: clamp(4px, .6vw, 12px); flex-wrap: wrap; min-width: 0; }
  .poeng .spiller {
    background: rgba(0,0,0,.42); border: 2px solid var(--kant); border-radius: 12px;
    padding: .18em .6em; display: flex; gap: .5em; align-items: baseline;
    font-size: .82em; line-height: 1.3; transition: border-color .18s, box-shadow .18s;
  }
  .poeng .spiller .navn { color: var(--dempet); }
  .poeng .spiller.deg { border-color: var(--gull); }
  .poeng .spiller.deg .navn { color: var(--tekst); }
  /* HVEM SIN TUR ER DET. Det sto ingen steder før; nå ringes setet inn. */
  .poeng .spiller.itur { border-color: var(--gull); box-shadow: 0 0 0 2px rgba(255,215,106,.35); }
  .poeng b { font-size: 1.5em; color: var(--gull); font-weight: 800; }
  .poeng .stikk { color: var(--pluss); font-weight: 700; }

  .kontrakt {
    display: flex; align-items: center; gap: .45em; flex-wrap: wrap;
    font-size: .95em; font-weight: 700;
    background: rgba(0,0,0,.38); border: 2px solid var(--kant);
    border-radius: 12px; padding: .18em .7em;
  }
  .kontrakt .hvem { color: var(--dempet); font-weight: 600; }
  .runde { margin-left: auto; color: var(--dempet); font-size: .8em; text-align: right; }

  /* ---------- Bordet: RUTENETT, ikke absolutt plassering ------------------ */
  /* Før lå de fire bordkortene på faste prosenter (`left:22%`, `right:22%`).
     På smal skjerm gikk venstre og høyre kort inn i hverandre og oppå
     midtinformasjonen. Et 3×3-rutenett kan ikke kollidere med seg selv. */
  .bord {
    position: relative; min-height: 0; min-width: 0;
    display: grid;
    grid-template-columns: 1fr minmax(0, auto) 1fr;
    grid-template-rows: 1fr minmax(0, auto) 1fr;
    place-items: center;
    gap: clamp(2px, .8vh, 10px);
  }
  .bordkort { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 0; }
  .bordkort .hvem {
    font-weight: 700; font-size: .72em; text-shadow: 0 2px 4px #000;
    white-space: nowrap; color: var(--dempet);
  }
  .bordkort .hvem .vant { color: var(--gull); }
  /* Toppkortet presses opp og bunnkortet ned, bort fra midtfeltet. Uten
     dette sentreres de i sin rad, og på lav skjerm er raden kortere enn
     kortet — da vokser kortet inn over TRUMF-skiltet i midten. */
  .bordkort.topp    { grid-area: 1 / 2; align-self: start; }
  .bordkort.venstre { grid-area: 2 / 1; }
  .bordkort.høyre   { grid-area: 2 / 3; }
  .bordkort.bunn    { grid-area: 3 / 2; align-self: end; }
  .midtfelt { grid-area: 2 / 2; display: flex; flex-direction: column; align-items: center; gap: 6px; }

  /* Trumfen skal ALLTID være synlig. Den lå bare som et lite tegn i
     kontraktlinja; nå står den midt på bordet så lenge runden spilles. */
  .trumfskilt {
    display: flex; align-items: center; gap: .5em;
    background: rgba(0,0,0,.5); border: 2px solid var(--kant-lys);
    border-radius: 999px; padding: .2em .8em; font-size: .82em; font-weight: 700;
  }
  .trumfskilt .merkelapp { color: var(--dempet); font-weight: 600; letter-spacing: .04em; }
  .etterlyst {
    display: flex; align-items: center; gap: .4em; flex-wrap: wrap; justify-content: center;
    background: rgba(0,0,0,.5); border: 2px solid var(--kant);
    border-radius: 999px; padding: .18em .75em; font-size: .78em;
  }
  .etterlyst .merkelapp { color: var(--dempet); }

  .dintur {
    background: var(--gull); color: #10200f; font-weight: 800;
    border-radius: 999px; padding: .25em 1em; font-size: .8em;
    box-shadow: 0 3px 14px rgba(255,215,106,.3);
  }
  .tenker {
    display: inline-flex; align-items: center; gap: .5em;
    background: rgba(0,0,0,.72); border: 2px solid var(--kant-lys);
    border-radius: 999px; padding: .25em .9em; font-size: .8em; font-weight: 600;
  }
  .tenker.topp { grid-area: 1 / 2; align-self: end; }
  .tenker.venstre { grid-area: 2 / 1; }
  .tenker.høyre { grid-area: 2 / 3; }
  .tenker.bunn { grid-area: 3 / 2; align-self: start; }
  /* Tre prikker som faktisk beveger seg. Uten en levende indikator er en
     tenkepause umulig å skille fra en hengt side. */
  .prikker { display: inline-flex; gap: 3px; }
  .prikker i { width: .32em; height: .32em; border-radius: 50%; background: var(--gull);
               animation: hopp 1.1s ease-in-out infinite; }
  .prikker i:nth-child(2) { animation-delay: .16s; }
  .prikker i:nth-child(3) { animation-delay: .32s; }
  @keyframes hopp { 0%, 60%, 100% { opacity: .3; transform: translateY(0); }
                    30% { opacity: 1; transform: translateY(-.28em); } }

  /* Forrige stikk — egen klasse i stedet for en stilstreng i app.ts, og
     `zoom` (som ikke er standard) byttet mot en skalering som virker. */
  .forrige {
    position: absolute; right: 0; top: 0; z-index: 2;
    background: rgba(0,0,0,.6); border: 2px solid var(--kant);
    border-radius: 12px; padding: .3em .5em; text-align: center;
    font-size: .62em; max-width: 42%;
  }
  .forrige .tittel { color: var(--dempet); margin-bottom: 2px; white-space: nowrap; }
  .forrige .tittel b { color: var(--gull); }
  .forrige .rad { display: flex; gap: 3px; justify-content: center; }
  .forrige .navn { color: var(--dempet); font-size: .9em; }
  /* Skjules bare når HØYDEN er knapp — altså liggende telefon, der bordet
     trenger hver piksel. På stående telefon er det rikelig med plass over
     hånden, og «hvem tok forrige stikk» er en av de mest brukte
     opplysningene i spillet; å skjule den på bredde var å kaste bort et
     hjelpemiddel der det fantes plass. */
  @media (max-height: 460px) { .forrige { display: none; } }
  @media (max-width: 560px) { .forrige { font-size: .55em; max-width: 54%; } }


  /* ---------- Kort ------------------------------------------------------- */
  /* MERK AT `--f` IKKE SETTES HER, og det er ikke en forglemmelse.
     Første utgave hadde `--f: var(--s-blekk)` som standard i `.kort`. Både
     `.kort` og `.f-H` er ett klassenavn, altså SAMME spesifisitet — og da
     vinner den som står sist i fila. `.kort` står etter `.f-*`, så alle kort
     ble spar-svarte: hele firefargestokken var borte fra hånden, mens
     trumfknappene (som ikke har `.kort`) beholdt fargene sine. Fanget på et
     skjermbilde av telefonen, ikke av noe som feilet. Standardverdien hører
     hjemme i `var()`-fallbacken, der den ikke kan overstyre noe. */
  .kort {
    width: var(--kb, var(--kort-maks));
    aspect-ratio: 0.7;
    background: var(--kortflate); color: var(--f, var(--s-blekk));
    border: 2px solid #b9bcae; border-radius: clamp(6px, .9vh, 12px);
    position: relative; cursor: pointer; padding: 0; flex: 0 0 auto;
    font: inherit; box-shadow: var(--skygge);
    transition: transform .14s ease, box-shadow .14s ease, filter .14s ease;
    /* `-webkit-touch-callout` slår av iOS-menyen «Kopier / Del» ved langtrykk.
       Uten den får man den midt i et kortvalg på iPad-en, og det ser ut som
       at trykket «gjorde noe rart» i stedet for ingenting. */
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
  }
  /* Hjørneindeksen i BEGGE hjørner, som på et ekte kort. Det øverste er det
     som er synlig når hånden ligger i vifte. */
  .kort .hjorne {
    position: absolute; top: 4%; left: 7%; text-align: center;
    font-weight: 800; font-size: clamp(15px, calc(.40 * var(--kb, 90px)), 46px); line-height: 1;
    letter-spacing: -.02em;
  }
  .kort .hjorne .sym { display: block; font-size: .92em; }
  .kort .hjorne.ned { top: auto; left: auto; bottom: 4%; right: 7%; transform: rotate(180deg); }
  .kort .midt {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: clamp(20px, calc(.60 * var(--kb, 90px)), 78px);
  }
  @media (max-width: 430px) { .kort .hjorne.ned { display: none; } }

  .kort:not([disabled]):hover { transform: translateY(-.9vh) scale(1.04); box-shadow: 0 10px 26px rgba(0,0,0,.6); }
  .kort:not([disabled]):active { transform: translateY(-.3vh) scale(.99); }
  .kort:focus-visible { outline: 4px solid var(--gull); outline-offset: 3px; z-index: 3; }
  .kort:not([disabled]):focus-visible { transform: translateY(-.9vh) scale(1.04); }
  /* ULOVLIG er ikke det samme som PASSIV, og de skal ikke se like ut.
     I spillfasen betyr «disabled» at kortet ikke KAN spilles — da skal det
     være tydelig dødt. I bud-, vrak- og trumffasen betyr det bare at panelet
     har ordet, og da må hånden fortsatt være fullt lesbar: den er selve
     grunnlaget for valget man står i. */
  .kort[disabled] { opacity: .42; filter: saturate(.35); cursor: default; }
  .hånd.passiv .kort[disabled] { opacity: .92; filter: none; }
  .bordkort .kort[disabled], .forrige .kort[disabled] { opacity: 1; filter: none; }
  .kort.valgt { outline: 4px solid var(--gull); outline-offset: 2px; transform: translateY(-1.4vh); z-index: 2; }
  .kort.liten { --kb: clamp(44px, 4.6vw + 3.2vh, 96px); }
  .forrige .kort { --kb: clamp(26px, 3.4vh, 44px); border-width: 1px; box-shadow: none; }

  /* Kort som nettopp ble lagt på bordet glir inn. Klassen settes bare på kort
     som IKKE lå der ved forrige tegning (se `nyeBordkort` i app.ts) — ellers
     ville hele bordet animert på nytt hver gang noe annet endret seg. */
  .bordkort .kort.ny { animation: legges .22s ease-out; }
  @keyframes legges { from { opacity: 0; transform: translateY(-18%) scale(.9); } }
  .bordkort.vant .kort { outline: 3px solid var(--gull); outline-offset: 2px; }

  /* ---------- Hånden ------------------------------------------------------
     BREDDEN REGNES UT FRA ANTALL KORT. `--n` settes i app.ts, og hvert kort
     får nøyaktig den plassen som er igjen delt på antallet — begrenset av et
     tak (så tolv kort ikke blir enorme på TV) og et GULV på 46 px.

     Gulvet er det som gjør oppførselen riktig i stedet for bare kompakt: når
     kortene ikke lenger kan bli mindre uten å bryte trykkflaten, bryter raden
     i to i stedet for å krympe videre. Før krympet flex dem til ~30 px på
     telefon — under både lesbarhet og tommelmål. */
  .hånd {
    display: flex; justify-content: center; align-items: flex-end;
    flex-wrap: wrap; gap: var(--kort-luft);
    padding: 2px 0 4px; min-height: 0;
  }
  /* `--n` (kort per rad) og `--kmaks` (høydetaket) settes av `håndmål()` i
     app.ts. Bredden er så det som er igjen, delt på antallet — begrenset
     nedad av trykkflaten og oppad av høyden. */
  .hånd .kort {
    --kb: clamp(
      var(--kort-min),
      calc((100% - (var(--n, 13) - 1) * var(--kort-luft)) / var(--n, 13)),
      var(--kmaks, var(--kort-maks))
    );
  }

  /* ---------- Paneler ----------------------------------------------------- */
  /* Et fast overlegg som sentrerer og dimmer. Panelet ruller INNI seg selv,
     så et høyt panel på liggende telefon aldri dytter noe utenfor skjermen. */
  .overlegg {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 12px;
    /* LETT DEMPING, IKKE SLØR. Første utgave hadde `blur(3px)` og 55 %
       mørklegging. Det så bra ut på et stillbilde og var galt i spill: når
       panelet spør «hvilken trumffarge?», er det HÅNDEN DIN du må se for å
       svare — og den lå bak sløret. En modal som skjuler grunnlaget for sitt
       eget spørsmål er verre enn ingen modal. */
    background: rgba(3, 10, 6, .3);
  }
  /* ANIMASJON BARE NÅR PANELET ER NYTT.
     `tegn()` bygger hele DOM-en på nytt ved hver tilstandsendring, så et
     panel som blir stående er likevel et NYTT element hver gang — og med
     animasjonen på `.overlegg` selv blinket og gled hele panelet på hvert
     eneste klikk mens man valgte vrakkort. `fersk` settes i `tegn()` bare
     når det er et ANNET panel enn forrige gang. Samme grep som `ny` på
     bordkortene, og av samme grunn. */
  .overlegg.fersk { animation: tone .16s ease-out; }
  .overlegg.fersk .panel { animation: opp .18s ease-out; }
  @keyframes tone { from { opacity: 0; } }
  .panel {
    background: var(--flate); border: 2px solid var(--kant-lys); border-radius: 20px;
    padding: clamp(12px, 2.2vh, 28px) clamp(14px, 2.4vw, 34px);
    /* Bredden følger innholdet. Fast `min(96vw, 900px)` ga et 900 px bredt
       panel rundt fire trumfknapper — mye tomrom, og det er halve grunnen
       til at en side ser uferdig ut. */
    width: fit-content; min-width: min(280px, 92vw);
    max-width: min(96vw, 900px); max-height: min(94vh, 94dvh); overflow: auto;
    box-shadow: 0 18px 60px rgba(0,0,0,.72); text-align: center;
  }
  @keyframes opp { from { opacity: 0; transform: translateY(10px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) {
    .overlegg, .panel, .bordkort .kort.ny { animation: none; }
    .prikker i { animation: none; opacity: .8; }
    .kort { transition: none; }
  }
  .panel h1 { font-size: clamp(1.3em, 2.6vh, 1.9em); margin: 0 0 .4em; }
  .panel h2 { font-size: clamp(1.05em, 2vh, 1.4em); margin: 0 0 .7em; line-height: 1.3; }
  .knapper { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }

  button.stor {
    font: inherit; font-size: clamp(.95em, 1.7vh, 1.25em); font-weight: 800;
    min-width: 3.4em; min-height: 48px; padding: .45em .95em;
    border-radius: var(--rad); border: 2px solid #4d6b7f; cursor: pointer;
    background: #1b2c3d; color: #fff; touch-action: manipulation;
    transition: background .14s, transform .1s, box-shadow .14s;
  }
  button.stor:hover { background: #2c4a68; }
  button.stor:active { transform: translateY(1px) scale(.985); }
  button.stor:focus-visible { outline: 4px solid var(--gull); outline-offset: 2px; }
  button.stor[disabled] { opacity: .38; cursor: default; }
  button.stor[disabled]:hover { background: #1b2c3d; }
  button.pass { background: #5a1e1e; border-color: #a15c5c; }
  button.pass:hover { background: #7c2c2c; }
  button.spesial { background: #43349b; border-color: #8a7ce0; }
  button.spesial:hover { background: #5646c0; }
  button.bekreft { background: #1c6c34; border-color: #58b072; font-size: clamp(1.05em, 2vh, 1.45em); }
  button.bekreft:hover { background: #26893f; }
  button.motstander { background: #16232f; text-align: left; }
  button.motstander.aktiv { background: #1d6b34; border-color: var(--gull); box-shadow: 0 0 0 3px rgba(255,215,106,.35); }
  .motstandere { margin-bottom: 1.2em; }

  /* ---------- Trumfvelgeren: fire KORT, ikke fire tekstknapper ------------
     Symbolet står i blekkfargen på hvit flate (der kontrasten er 5–17:1),
     navnet står under, og en farget stripe langs toppen gjør at fargen kan
     leses av på avstand uten å lese symbolet. Spar kan ikke lenger forsvinne,
     for spar er nå den MØRKESTE flekken på en HVIT flate i stedet for en
     mørk flekk på en mørk flate. */
  .trumfvalg { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.6vw, 18px); justify-content: center; }
  button.trumfkort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: var(--kortflate); color: var(--f);
    border: 3px solid var(--kant-lys); border-radius: var(--rad);
    padding: 0; overflow: hidden;
    width: clamp(84px, 17vw, 150px); min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
    box-shadow: var(--skygge);
    transition: transform .14s, box-shadow .14s, border-color .14s;
  }
  button.trumfkort .stripe { display: block; width: 100%; height: 10px; background: var(--f); }
  button.trumfkort .tsym { font-size: clamp(30px, 6vh, 56px); line-height: 1; margin-top: .18em; }
  button.trumfkort .tnavn { font-size: clamp(13px, 1.7vh, 19px); font-weight: 800; color: #333; letter-spacing: .01em; margin-bottom: .45em; }
  button.trumfkort:hover { transform: translateY(-4px); box-shadow: 0 12px 28px rgba(0,0,0,.6); border-color: var(--gull); }
  button.trumfkort:active { transform: translateY(-1px) scale(.99); }
  button.trumfkort:focus-visible { outline: 4px solid var(--gull); outline-offset: 3px; }
  button.trumfkort.valgt { border-color: var(--gull); box-shadow: 0 0 0 3px rgba(255,215,106,.4), var(--skygge); }

  /* ---------- Etterlysningen: MINIKORT, ikke farget tekst på mørk flate ---
     Her var spar verst. Knappene hadde `background:#16232f` og
     `color:#1a1a1a` — svart på mørk blå. Nå er hver valør et lite kort med
     hvit flate, altså samme kontrastforhold som kortene på hånden. */
  .etterlysrad {
    display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: .6em 0 1em;
  }
  button.minikort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: var(--kortflate); color: var(--f);
    border: 2px solid #b9bcae; border-radius: 10px;
    min-width: 48px; min-height: 60px; padding: .2em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    font-weight: 800; box-shadow: 0 2px 6px rgba(0,0,0,.4);
    transition: transform .12s, box-shadow .12s, border-color .12s;
  }
  button.minikort .v { font-size: clamp(17px, 2.3vh, 24px); }
  button.minikort .sym { font-size: clamp(15px, 2vh, 22px); }
  button.minikort:hover { transform: translateY(-3px); border-color: var(--gull); box-shadow: 0 8px 18px rgba(0,0,0,.55); }
  button.minikort:active { transform: translateY(0) scale(.98); }
  button.minikort:focus-visible { outline: 4px solid var(--gull); outline-offset: 2px; }

  .vrakhånd { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1em; }
  .vrakhånd .kort { --kb: clamp(48px, 4.6vw + 3.4vh, 104px); }

  .bekreftlinje { font-size: clamp(1em, 2vh, 1.3em); margin: .5em 0 .2em; line-height: 1.6; }
  .bekreftsmatt { opacity: .72; font-size: .82em; margin: 0 0 1em; }

  .resultat h2 { font-size: clamp(1.05em, 2.2vh, 1.5em); }
  .delta { display: flex; gap: clamp(8px, 2vw, 24px); justify-content: center;
           font-size: clamp(.9em, 1.8vh, 1.2em); margin-bottom: 1.2em; flex-wrap: wrap; }
  .delta .pluss { color: var(--pluss); } .delta .minus { color: var(--minus); }
  .lite { font-size: .72em; color: var(--dempet); } .lite a { color: #8ecbff; }

  .start input {
    font: inherit; font-size: 1.05em; padding: .5em .8em; border-radius: 10px;
    border: 2px solid var(--kant-lys); background: #0d1c13; color: #fff;
    margin: .5em 0 1.2em; width: 14em; max-width: 100%; min-height: 48px;
  }
  .start input:focus-visible { outline: 3px solid var(--gull); outline-offset: 2px; border-color: var(--gull); }
  .start label { display: block; color: var(--dempet); font-size: .85em; }
  .start p { color: #d6e3cc; font-size: .9em; margin: .2em 0 1em; }
  /* Laste-tilstanden var en naken overskrift. Nå viser den at noe skjer. */
  .laster { display: flex; flex-direction: column; align-items: center; gap: .8em; }
  .laster .stripe { width: min(280px, 70vw); height: 6px; border-radius: 999px;
                    background: rgba(255,255,255,.14); overflow: hidden; }
  .laster .stripe i { display: block; width: 40%; height: 100%; border-radius: 999px;
                      background: var(--gull); animation: sklir 1.1s ease-in-out infinite; }
  @keyframes sklir { 0% { transform: translateX(-110%); } 100% { transform: translateX(320%); } }
  @media (prefers-reduced-motion: reduce) { .laster .stripe i { animation: none; width: 100%; opacity: .5; } }

  /* ================= LAV SKJERM = LIGGENDE TELEFON =======================
     390 piksler høyde skal romme topplinje, fire bordkort, midtfelt og hele
     hånden. Målt på 844×390 gikk toppkortet over TRUMF-skiltet og bunnkortet
     over etterlysningen: bordkortene var dimensjonert med `3.2vh`, som på en
     TV er rikelig og her er tolv piksler.

     TRUMF-SKILTET FJERNES HELT, og det er ikke et tap: kontraktbrikken øverst
     sier allerede «Du meldte 12 i ♠ spar». To skilt om samme sak, der det er
     minst plass, er nøyaktig feil sted å bruke den plassen.

     BLOKKEN STÅR SIST I FILA MED VILJE. Første plassering var midt i
     bord-avsnittet, og da tapte `.kort.liten` mot sin egen grunnregel lenger
     nede — lik spesifisitet, og da vinner den som står sist. Nøyaktig samme
     feil som `--f` i `.kort`, samme dag. Regler som skal OVERSTYRE hører
     hjemme etter det de overstyrer. */
  @media (max-height: 500px) {
    .kort.liten { --kb: clamp(34px, 9vh, 60px); }
    .bordkort .hvem { font-size: .58em; }
    .trumfskilt { display: none; }
    .etterlyst, .dintur, .tenker { font-size: .66em; }
    .midtfelt { gap: 3px; }
  }
</style>
