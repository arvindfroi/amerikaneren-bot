  /* ==========================================================================
     AMERIKANEREN DEMO — stilark
     ==========================================================================

     ============================ IDENTITETEN ==============================

     Bygget på appikonet Arvind leverte: dyp koboltblå, en femtakket stjerne
     fylt med røde og hvite striper, og de fire kortfargene rundt den i blank
     3D. Americana — flagg-rødt, hvitt og blått.

         KOBOLT      grunnfargen. Radialen er MØRKEST I MIDTEN og lysner
                     utover, slik ikonet er — motsatt av den vanlige vignetten,
                     og derfor gjenkjennelig som nettopp dette spillet.
         KORALL      den ENE aksenten. Alt som skal ropes sier det i korall.
         STJERNA     motivet som går igjen: kortbaksiden, trumfskiltet,
                     stikkvinneren, lasteindikatoren, faviconen.

     ==================== HVA DENNE RUNDEN ENDRET ==========================

     ARVIND: «jeg er ikke helt fornøyd med viben … soft shading, den gradient
     bakgrunnen og animasjoner som minner om et mer polert spill … boksene ser
     veldig basic ut … jeg vil ikke at det skal se ut som et bord, men litt
     mer abstrakt … det bør være et bedre visuelt hierarki gjennom hele
     appen.»

     Fire ting fulgte av det, og de henger sammen:

     1. FLATER MED FORM. Hver boks var `background` + `2px solid` — altså
        standard-UI. Nå har alle flater samme oppskrift: gradient med lys på
        oversiden, hårfin lysstripe langs toppkanten, myk slagskygge, ingen
        hard ramme. Det er den blanke 3D-en fra ikonet, gjort om til en regel
        som gjelder paneler, knapper, skilt og brikker likt.

     2. ET ROM, IKKE ET BORD. Bakgrunnen var radialen alene med et 62vh stort
        stjernevannmerke midt på — flaten leste som en logo med kort oppå. Nå
        er det tre lag: lys som faller inn ovenfra, en myk bunnglød der
        kortene lander, og stjerna liten og svak. Ingen av lagene har en kant,
        og uten kant kan det ikke leses som en bordplate.

     3. HIERARKI. Fem like bokser på topplinja konkurrerte om samme
        oppmerksomhet. Poengene er nå ETT brett med tynne skiller og din egen
        rute merket i korall; kontrakten står alene; «din tur» er det eneste
        som lyser når det gjelder. I hånden er forskjellen på spillbar og ikke
        HØYDE og LYS, ikke utbleking — så hierarkiet koster ikke lesbarhet.

     4. LAGSTIKK-BAREN. Regelen gjort synlig: fram til makkeren er avslørt
        teller den enkeltes stikk, etterpå er det lagets. Se `.lagfelt`.

     ==================== FIREFARGESTOKKEN BEHOLDES ========================

     Ikonet bruker to farger: koks for spar og kløver, korall for hjerter og
     ruter. Kortene gjør IKKE det, og det er et bevisst avvik. Hele runde 1
     handlet om at spar var vanskelig å skille — å slå spar og kløver sammen i
     én farge ville gjeninnført nøyaktig det problemet.

         spar     koks       ikonets mørke
         hjerter  korall     ikonets røde
         ruter    kobolt     ikonets blå
         kløver   grønn      den fjerde, dempet så den ikke slåss med resten

     ================= TO PALETTER PER FARGE, SOM FØR ======================

     `--f` er blekk på hvit kortflate, `--fd` er flateverdi på mørk bakgrunn.
     På mørk flate vises en farge ALDRI som farget tekst, bare som fylt merke
     med nesten svart symbol oppå. Den regelen tok etterlysningsknappene fra
     1,09:1 til 17,40:1, og den er urørt her. Målt på nytt etter ombyggingen,
     ikke antatt.
     ====================================================================== */

  :root {
    /* ============ PALETTEN, TATT FRA IKONET OG IKKE FRA MINNET ========
       Den forrige paletten var dempet marine — pen, seriøs, og feil. Arvinds
       ikon er HØYMETTET royalblå, nesten elektrisk, og lysner til hvitt mot
       kantene. Fargene under er lest ut av `web/konsept/appikon.png`. */
    --kobolt-950: #0b1a86;
    --kobolt-900: #1226b4;
    --kobolt-800: #1a2fe0;
    --kobolt-700: #2b4bee;
    --kobolt-600: #4b74f4;
    --kobolt-400: #8fabf8;
    --kobolt-200: #cbdafc;

    /* Korall — den ene aksenten */
    --korall: #f2382c;
    --korall-lys: #ffa79c;
    --korall-dyp: #cf2b20;

    --krem: #f7f4ec;
    --kritt: #ffffff;
    --koks: #171b22;

    --tekst: #eef3fc;
    --tekst-2: #cbdcf7;
    --tekst-3: #a9c2ea;

    --ok: #4ad07f;
    --minus: #ff8a76;

    /* ================= FLATER: MYK SKYGGE, IKKE KANT ======================
       Hver flate er en gradient med lys på oversiden og mørke under, pluss en
       hårfin lysstripe langs toppkanten. Det er den samme «blanke 3D-en» som
       kortfargene i ikonet har: lys ovenfra, ingen hard kantlinje. Alle
       paneler, knapper, skilt og brikker deler oppskriften, så flatene hører
       hjemme i samme rom i stedet for å være hver sin boks. */
    /* ============ FLATENE ER NÅ UGJENNOMSIKTIGE, OG DET MÅ DE VÆRE ====
       Før var hver flate en gjennomskinnelig hinne over en mørk bakgrunn.
       Det gikk så lenge bakgrunnen var mørk overalt. Nå LYSNER rommet mot
       kantene — det er signaturen i ikonet — og en hinne oppå en nesten hvit
       kant gir hvit tekst på lys flate. Altså nøyaktig den feilen runde 1
       brukte hele sin tid på å fjerne, bare speilvendt.

       Derfor er flatene dyp, ugjennomsiktig kobolt. Da er kontrasten den
       samme uansett hvor på skjermen de havner: hvit tekst mot #17318f er
       11,2:1 i midten og 11,2:1 ute ved kanten. */
    --flate: linear-gradient(var(--lysfall), #23429f 0%, #0d1e63 100%);
    --flate-hev: linear-gradient(var(--lysfall), #3457c9 0%, #14287a 100%);
    --flate-dyp: linear-gradient(var(--lysfall), #1a3080 0%, #08123f 100%);
    /* Ingen harde kanter. Der det sto `1px solid`, står det nå ingenting —
       flatene skilles fra rommet med en myk skygge og et svakt lysslør. */
    --hinne: transparent;
    --hinne-lys: transparent;
    --topplys: inset 0 1px 0 rgba(206,229,255,.22);
    --innskygge: inset 0 -1px 0 rgba(2,8,24,.42);

    /* ============ ÉN LYSKILDE, OPPE TIL VENSTRE =======================
       ARVIND: «han må også belyse objekter på samme måte.»

       Det er den enkeltfaktoren som skiller en scene som er DESIGNET fra en
       som er satt sammen. Er hvert element pent for seg, men belyst fra hver
       sin kant, leses helheten som klipp og lim.

       Så det er én regel, og den gjelder alt: LYSET KOMMER FRA OPPE TIL
       VENSTRE. Følgene er to konstanter alle flater bruker:

         `--lysfall`  vinkelen enhver flategradient går i (lyst øvre venstre
                      → mørkt nedre høyre). 152°, ikke 180°.
         `--fall-*`   skyggene. De har POSITIV x-forskyvning, altså faller de
                      ned og til HØYRE — dit lyset ikke når. En skygge rett
                      under er ingen lyskilde; det er en standardinnstilling. */
    --lysfall: 152deg;
    --fall-1: 2px 3px 9px rgba(6,16,70,.34);
    --fall-2: 4px 6px 18px rgba(6,16,70,.4);
    --fall-3: 8px 12px 36px rgba(4,10,54,.46);
    --loft-1: var(--fall-1);
    --loft-2: var(--fall-2);
    --loft-3: var(--fall-3);
    --glo-korall: 0 0 22px rgba(242,56,44,.7), 4px 6px 18px rgba(6,16,70,.4);

    --rad: 14px;
    --rad-s: 10px;
    --rad-l: 20px;

    /* Easing med karakter. `--sprett` skyter litt over og faller tilbake —
       det er forskjellen på «et element flyttet seg» og «noe landet». */
    --myk: cubic-bezier(.22, .82, .28, 1);
    --sprett: cubic-bezier(.34, 1.56, .58, 1);
    --ut-inn: cubic-bezier(.5, 0, .2, 1);

    --kortflate: #f9f7f0;

    /* FARGENE PÅ HVIT KORTFLATE. Kontrast mot #f9f7f0:
       spar 16,4:1 · hjerter 5,2:1 · ruter 7,4:1 · kløver 6,0:1 */
    --s-blekk: #171b22;
    --h-blekk: #b52a19;
    --r-blekk: #164291;
    --k-blekk: #256b3a;

    /* FARGENE PÅ MØRK FLATE — brukes som BAKGRUNN i `.fargemerke`,
       med nesten svart symbol oppå. 9–17:1 for alle fire. */
    --s-mork: #edf2fb;
    --h-mork: #ff8a76;
    --r-mork: #86b6ff;
    --k-mork: #74d992;

    --slab: "Alfa Slab One", "Bookman Old Style", Rockwell, Georgia, serif;
    --sans: "Libre Franklin", "Franklin Gothic Medium", "Segoe UI", system-ui, sans-serif;

    /**
     * ============ SIGNATUREN, ÉN GANG, FOR HELE NETTSTEDET ============
     *
     * ARVIND: «de hvite kantene og den blåe overgangen … resten av nettsiden
     * må følge designet.»
     *
     * Dette ER appikonet: dyp, mettet kobolt i midtpartiet som glir ut mot
     * nesten hvitt ytterst. Ingen ramme, ingen strek — fargen slipper bare
     * taket mot kanten.
     *
     * Den står som EN variabel fordi den ellers ville stått i to utgaver som
     * driver fra hverandre. Bordet hadde den; startskjermen, budpanelet,
     * vrakpanelet og rundeoppgjøret hadde et mørkt slør i stedet, og de så
     * ut som de hørte til en annen app. Nå arver hver eneste skjerm den fra
     * samme sted.
     */
    --rom-fall: radial-gradient(ellipse 96% 78% at 50% 36%,
      #1a2fe0 0%, #2a44ea 26%, #4f72f2 50%,
      #86a4f7 70%, #bccffa 84%, #e6edfd 94%, #fbfdff 100%);
    /* Samme fall, gjennomskinnelig: overlegg skal bære signaturen OG la
       bordet ane seg bak. Et helt tett overlegg ville tatt fra spilleren det
       eneste stedet stillingen står skrevet. */
    --rom-fall-slor: radial-gradient(ellipse 96% 78% at 50% 36%,
      rgba(26,47,224,.92) 0%, rgba(42,68,234,.92) 26%, rgba(79,114,242,.9) 50%,
      rgba(134,164,247,.9) 70%, rgba(188,207,250,.92) 84%,
      rgba(230,237,253,.94) 94%, rgba(251,253,255,.96) 100%);
    /* Panelflaten: samme koboltfamilie, lys oppe til venstre. */
    --panelflate: linear-gradient(var(--lysfall), #1e39c0 0%, #101d7e 100%);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    /* ============ OMVENDT VIGNETT — SIGNATUREN ======================
       Både ikonet og iPad-skissen gjør det samme, og ingen beskrivelse fikk
       det fram: DYP, METTET KOBOLT I MIDTPARTIET SOM FADER TIL NESTEN HVITT
       YTTERST. Alle andre spill mørkner mot kantene. Dette lysner, og det er
       det man kjenner igjen på tvers av rommet.

       Tre stopp gjør jobben: den mettede kjernen, et periwinkle-belte, og
       den nesten hvite kanten. Ingen av dem har en grense man kan se. */
    background: var(--rom-fall);
    color: var(--tekst);
    font: clamp(15px, 1.05vh + 0.7vw, 26px)/1.45 var(--sans);
    font-variant-numeric: tabular-nums;
    overflow: hidden;
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }
  /* ============ RUTENETTET: BORD TIL VENSTRE, SØYLE TIL HØYRE ===========
     Arvind tegnet spillet på iPad LIGGENDE: tre motstandere overfor bordet,
     og én vertikal stikksøyle langs høyre kant. Rutenettet er derfor to
     kolonner — bordet tar all plassen som blir til overs, søylen tar det den
     trenger — med topplinja og hånden tvers over begge.

     Søylen er `auto`, ikke en fast bredde: uten kontrakt melder den seg av
     (`.stikksoyle.tom` er 0 bred) og bordet får hele flaten. */
  #app {
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr) auto;
    height: 100%; height: 100dvh;
    gap: clamp(4px, 0.8vh, 12px);
    padding: max(6px, env(safe-area-inset-top)) max(8px, env(safe-area-inset-right))
             max(6px, env(safe-area-inset-bottom)) max(8px, env(safe-area-inset-left));
    position: relative; z-index: 1;
  }
  #app > header   { grid-column: 1 / -1; grid-row: 1; }
  #app > .bord    { grid-column: 1; grid-row: 2; }
  #app > .stikksoyle { grid-column: 2; grid-row: 2; }
  #app > .handrad { grid-column: 1 / -1; grid-row: 3; }

  #oppleser, .skjult {
    position: absolute; width: 1px; height: 1px; overflow: hidden;
    clip: rect(0 0 0 0); white-space: nowrap;
  }
  /* Symboldefinisjonene. Ligger UTENFOR `#app` med vilje: appen bygger
     `#app` på nytt med `innerHTML` ved hver tilstandsendring, og en `<defs>`
     der inne ville forsvunnet under føttene på hver `<use>`. */
  .symboler { position: absolute; width: 0; height: 0; overflow: hidden; }

  /* ================== ROMMET, IKKE BORDET ================================
     ARVIND: «jeg vil ikke at det skal se ut som et bord, men litt mer
     abstrakt.»

     Så det er ikke et møbel. Ingen filt, ingen treramme, ingen oval kant. Det
     er et ROM med lys ovenfra: en bred lysflate som faller inn fra toppen, og
     en myk bunnglød der kortene lander. Kortene ligger i et lyspunkt, ikke på
     en plate — og siden hverken lyset eller gløden har en kant, kan de ikke
     leses som en bordflate.

     Stjerna er fortsatt der som identitet, men liten og svak. Før var den
     62vh og dominerte hele flaten; den så ut som en logo lagt bak spillet,
     ikke som et sted spillet foregår. */
  .rom { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
  /* HORISONTEN. I skissen går det en svak lys bue tvers over øvre tredel —
     ikke en bordkant, men et sted der lyset skifter. Den er tegnet som en
     bred, sterkt uskarp ellipse: har den en kant, blir den en bordplate, og
     Arvind har sagt at det ikke skal være et bord. */
  .rom .skinn {
    position: absolute; left: 50%; top: -46%; transform: translateX(-50%);
    width: min(230vh, 178vw); height: 86%;
    border-radius: 50%;
    background: radial-gradient(ellipse 50% 50% at 50% 50%,
      rgba(255,255,255,.30) 0%, rgba(190,215,255,.14) 58%, rgba(190,215,255,0) 75%);
    filter: blur(26px);
    animation: pust 19s ease-in-out infinite;
  }
  /* Bunngløden: der kortene lander, siver det lys opp fra flaten. */
  .rom .grunn {
    position: absolute; left: 50%; top: 62%; transform: translate(-50%, -50%);
    width: min(150vh, 108vw); height: min(74vh, 66vw);
    background: radial-gradient(ellipse at 50% 50%,
      rgba(150,185,255,.26) 0%, rgba(140,178,252,.09) 46%, rgba(140,178,252,0) 72%);
    filter: blur(18px);
  }
  .rom .stjerne {
    position: absolute; left: 50%; top: 48%;
    width: min(38vh, 38vw); height: min(38vh, 38vw);
    transform: translate(-50%, -50%);
    opacity: .045; filter: blur(3px);
  }
  @keyframes pust { 0%, 100% { opacity: .78; } 50% { opacity: 1; } }

  /* ---- Stjerna ----------------------------------------------------------- */
  .stjerne { display: block; width: 1em; height: 1em; }

  /* ---- Fargemerket: den ene måten en farge vises på mørk flate -----------
     BEHOLDT UENDRET FRA RUNDE 1. Det var denne regelen som tok
     etterlysningsknappene fra 1,09:1 til 17,40:1, og den skal ikke ofres for
     penere flater. Målt på nytt etter denne runden også. */
  .fargemerke {
    display: inline-flex; align-items: center; gap: .3em;
    background: var(--fd); color: #0a0f18;
    border-radius: 999px; padding: .06em .55em .12em;
    font-weight: 800; line-height: 1.25; white-space: nowrap;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 1px 3px rgba(2,8,24,.5);
  }
  .fargemerke .sym { font-size: 1.15em; }
  .f-S { --f: var(--s-blekk); --fd: var(--s-mork); }
  .f-H { --f: var(--h-blekk); --fd: var(--h-mork); }
  .f-R { --f: var(--r-blekk); --fd: var(--r-mork); }
  .f-K { --f: var(--k-blekk); --fd: var(--k-mork); }

  /* ================== TOPPLINJA: ETT BRETT, IKKE FIRE BOKSER =============
     Før var dette fem like bokser med lik ramme og lik vekt — fire poeng og
     én kontrakt — og ingen av dem sa hva som var viktigst. Nå er poengene ETT
     brett med tynne skiller, din egen rute er merket i korall, og kontrakten
     står for seg selv som den ene opplysningen som gjelder hele runden.

     Rutenettet er FAST (auto 1fr auto). Før var det `flex-wrap`, og linja
     brøt om til to rader når kontraktteksten vokste — layouten mistet formen
     sin midt i en runde. */
  header {
    display: grid; grid-template-columns: auto minmax(0, 1fr) auto;
    align-items: center; gap: clamp(6px, 1.4vw, 18px);
  }
  .tavle {
    display: flex; align-items: stretch; border-radius: var(--rad);
    background: var(--flate); box-shadow: var(--topplys), var(--loft-1);
    border: 1px solid var(--hinne); overflow: hidden; min-width: 0;
  }
  .tavle .spiller {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: .22em .62em .28em; min-width: 3.4em; position: relative;
    transition: background .28s var(--myk);
  }
  .tavle .spiller + .spiller::before {
    content: ""; position: absolute; left: 0; top: 20%; bottom: 20%;
    width: 1px; background: rgba(150,190,250,.16);
  }
  .tavle .navn {
    font-size: .56em; letter-spacing: .1em; text-transform: uppercase;
    color: var(--tekst-3); font-weight: 700; line-height: 1.2;
  }
  .tavle .verdi { display: flex; align-items: baseline; gap: .32em; line-height: 1.15; }
  .tavle b { font-size: 1.02em; font-weight: 800; color: var(--kritt); }
  .tavle .stikk { font-size: .62em; font-weight: 700; color: var(--kobolt-200); }
  .tavle .deg { background: linear-gradient(180deg, rgba(232,80,63,.26) 0%, rgba(232,80,63,.05) 100%); }
  .tavle .deg .navn { color: var(--korall-lys); }
  /* Hvem sin tur det er: en korallstripe langs bunnen av ruta. Rolig når det
     er en bot, og den samme formen uansett hvem — ingen ny boks. */
  .tavle .itur::after {
    content: ""; position: absolute; left: 12%; right: 12%; bottom: 0; height: 3px;
    border-radius: 3px 3px 0 0; background: var(--korall);
    box-shadow: 0 0 12px rgba(232,80,63,.8);
    animation: stripe-inn .34s var(--sprett) both;
  }
  @keyframes stripe-inn { from { transform: scaleX(0); opacity: 0; } }
  /* Poengtallet som nettopp endret seg. */
  .tavle b.endret { animation: tellerslag .62s var(--sprett); }
  @keyframes tellerslag {
    0% { transform: scale(1); }
    36% { transform: scale(1.34); color: var(--korall-lys); }
    100% { transform: scale(1); }
  }

  .kontrakt {
    display: flex; align-items: center; justify-content: center; gap: .45em;
    font-size: .92em; font-weight: 700; min-width: 0;
    background: var(--flate); border: 1px solid var(--hinne);
    box-shadow: var(--topplys), var(--loft-1);
    border-radius: 999px; padding: .2em .85em; justify-self: center;
  }
  /* `.inn` settes bare når stykket er NYTT — se `pynt()` i app.ts. Uten den
     ville hvert skilt spilt inngangen sin på nytt flere ganger i sekundet. */
  .kontrakt.inn { animation: kontrakt-inn .4s var(--sprett) both; }
  @keyframes kontrakt-inn { from { opacity: 0; transform: translateY(-6px) scale(.94); } }
  .kontrakt .hvem { color: var(--tekst-2); font-weight: 600; }
  .kontrakt .bud { font-size: 1.12em; color: var(--kritt); font-weight: 800; }
  /* Rundetelleren sto som dempet tekst rett på flaten. Det gikk da flaten
     var mørk overalt; nå lysner rommet mot kantene, og øvre høyre hjørne er
     nettopp der den er lysest. Målt: teksten forsvant helt. Den har fått
     samme mørke flate som resten av topplinja. */
  .runde {
    color: var(--tekst-2); font-size: .68em; text-align: right; line-height: 1.2;
    white-space: nowrap; background: var(--flate); border-radius: var(--rad-s);
    padding: .24em .6em; box-shadow: var(--topplys), var(--fall-1);
  }

  /* ================== STIKKSØYLEN ========================================
     ARVIND, om konseptkunsten: «hvert stikk fyller opp en bar for alle 4
     spillere. budvinner og makker skal fylle den blå med stjerner opp til
     budnivået og forsvarere skal ta stikk. forsvar spiller 1 er rød og
     forsvarspiller 2 er hvit fordi de deler ikke poeng.»

     DETTE ERSTATTER LAGSTIKK-BAREN, og det er en skarpere idé enn den. Den
     gamle baren viste laget mot budet og skjøv motstanden ned i ett enkelt
     tall «mot 3» — som om de tre andre var én blokk. Det er de ikke: i
     Amerikaneren fører hver forsvarer SIN egen konto. Én søyle med én sone
     per konto sier regelen rett ut, uten en eneste hjelpetekst.

     FORMEN, ovenfra og ned, som i tegningen:
        rød        forsvarsspiller 1
        hvit       forsvarsspiller 2
        (stål      forsvarsspiller 3 — bare før makkeren er funnet, og ved
                   solo/amerikaner der det aldri blir noen makker)
        blå        budvinner og makker, den største, med stjerner

     HØYDENE ER IKKE VILKÅRLIGE. Den blå sonen har ett hakk per stikk
     kontrakten krever, forsvarssonene ett per stikk som blir til overs om
     kontrakten går inn akkurat. Søylen er altså hele runden, delt slik
     kontrakten deler den — og budnivåstreken er der den blå slutter.

     TALLET STÅR ALLTID. Fargen er en snarvei; sonens tall og navn er det som
     bærer, akkurat som `fargemerke` gjør det for kortfargene. */
  .stikksoyle {
    display: flex; flex-direction: column; gap: clamp(3px, .7vh, 7px);
    width: clamp(46px, 5.4vw, 92px); min-height: 0; height: 100%;
    margin-left: clamp(34px, 3.6vw, 58px); /* plass til medaljongene utenfor */
    transition: width .4s var(--myk), margin-left .4s var(--myk);
  }
  /* Ingen kontrakt ennå: søylen melder seg av, og bordet får hele flaten. */
  .stikksoyle.tom { width: 0; margin-left: 0; gap: 0; }

  /* SØYLA ER AIRBRUSHET. I skissen er sonene myke fargefelt med glød rundt,
     ikke bokser med ramme: den røde toner fra lys til dyp, den hvite fra ren
     hvit til grå, den blå er dyp med hvite stjerner strødd i. Ingen av dem
     har en strek. */
  .sone {
    position: relative; overflow: visible;
    /* En sone kan bli så lav som ETT hakk (ved solo, og ved bud lik antall
       stikk). Uten et gulv ble den lavere enn sin egen medaljong, og fjeset
       stakk ut over både sonen over og under. */
    min-height: clamp(34px, 4.4vw, 58px);
    border-radius: clamp(6px, .8vh, 10px);
    display: flex; flex-direction: column-reverse; gap: 1px;
    padding: 2px;
    /* SØYLA ER FLAT OG GRAFISK — et tredje materiale, ikke en tredje flate
       med samme behandling. Kortflatene er matte, kortfargene er runde og
       belyste, søyla er et diagram. Gløden som lå her er strøket etter
       regelen: kunne den fjernes uten at noe ble dårligere, var den pynt. */
    background: var(--sonetom, linear-gradient(var(--lysfall), #17246e, #0b1247));
    box-shadow: var(--fall-1);
  }
  /**
   * Sonens egen farge — brukes bare som FLATE, aldri som tekstfarge.
   *
   * HVER SONE HAR OGSÅ EN TOM UTGAVE, og det er ikke pynt. Uten den var
   * søyla helt blå ved rundens start: fargen kom først når et hakk ble
   * fylt, altså etter første stikk. Da kunne man ikke se HVEM sonene tilhørte
   * før spillet var i gang — og hele poenget med rød, hvit og blå er at man
   * skal vite det på forhånd. Den tomme utgaven er samme farge, dempet ned
   * til at den leser som «her hører det hjemme, det er bare ikke tatt ennå».
   */
  .sone.rod   { --sonefyll: linear-gradient(var(--lysfall), #ffa79c 0%, #f7594a 42%, #d92c1c 100%);
                --sonetom: linear-gradient(var(--lysfall), #a03325 0%, #661d13 100%); }
  .sone.hvit  { --sonefyll: linear-gradient(var(--lysfall), #ffffff 0%, #f4f1e9 46%, #cfc8b9 100%);
                --sonetom: linear-gradient(var(--lysfall), #a8a49a 0%, #6d6a62 100%); }
  .sone.staal { --sonefyll: linear-gradient(var(--lysfall), #dfeaff 0%, #a8bfe0 46%, #6a83a8 100%);
                --sonetom: linear-gradient(var(--lysfall), #3f5476 0%, #2a3a55 100%); }
  .sone.blaa  { --sonefyll: linear-gradient(var(--lysfall), #7ba1f8 0%, #2b4bee 44%, #122296 100%);
                --sonetom: linear-gradient(var(--lysfall), #17246e 0%, #0b1247 100%); }

  .celle {
    flex: 1 1 0; min-height: 0; border-radius: 3px;
    background: rgba(255,255,255,.045);
    display: grid; place-items: center; overflow: hidden;
    transition: background .3s var(--myk), opacity .3s var(--myk);
  }
  /* Fylte hakk står KANT I KANT med 1 px mellomrom, slik at en rekke av dem
     leser som ett mykt fargefelt — som i skissen — og ikke som en stolpe av
     klosser. Tallet ved siden av sier det eksakte antallet uansett. */
  .celle.fylt { background: var(--sonefyll); }
  /* Den blå sonen fylles med STJERNER — motivet fra ikonet, og Arvinds eget
     ord for hva som skal skje der. */
  .celle .stjerne { width: 78%; height: 78%; max-height: 100%; opacity: .13; }
  .celle.fylt .stjerne { opacity: 1; }
  .celle.ny { animation: celle-inn .52s var(--sprett) both; }
  @keyframes celle-inn {
    0% { transform: scale(.34); }
    58% { transform: scale(1.16); }
    100% { transform: scale(1); }
  }

  /* Tallet: eget mørkt merke, aldri farget tekst på fargeflaten. Da er
     kontrasten den samme på rød, hvit, stål og blå — 15,9:1 mot alle fire. */
  .sone .tall {
    position: absolute; z-index: 4; right: 3px; bottom: 3px;
    background: rgba(3,9,24,.88); color: var(--kritt);
    border-radius: 999px; padding: .04em .42em .1em;
    font-size: clamp(11px, 1.55vh, 18px); font-weight: 800; line-height: 1.2;
    box-shadow: inset 0 0 0 1px rgba(180,210,255,.32), 0 1px 4px rgba(0,0,0,.6);
  }
  .sone .tall .mot { color: var(--kobolt-200); font-weight: 700; }
  .sone .tall.slag { animation: tellerslag .62s var(--sprett); }

  /* BUDNIVÅSTREKEN: skravert, tvers over toppen av den blå sonen, med
     tallet ved siden — nøyaktig som i tegningen. */
  .budstrek {
    position: absolute; left: 0; right: 0; top: 0; z-index: 3;
    height: clamp(6px, .9vh, 10px); pointer-events: none;
    border-top: 2px solid rgba(255,255,255,.95);
    background: repeating-linear-gradient(115deg,
      rgba(255,255,255,.85) 0 3px, rgba(255,255,255,0) 3px 8px);
    border-radius: clamp(7px, 1vh, 12px) clamp(7px, 1vh, 12px) 0 0;
  }
  .budmerke {
    position: absolute; z-index: 5; top: 0; right: 3px; transform: translateY(-52%);
    background: linear-gradient(180deg, #fffdf6 0%, var(--krem) 100%); color: #101623;
    border-radius: 999px; padding: .02em .44em .08em;
    font-size: clamp(11px, 1.5vh, 17px); font-weight: 800; line-height: 1.25;
    box-shadow: 0 1px 5px rgba(2,8,24,.8), inset 0 0 0 1px rgba(23,27,34,.25);
  }
  .sone.blaa.klart { box-shadow: inset 0 0 0 2px rgba(74,208,127,.8), 0 0 26px rgba(74,208,127,.38); }

  /* MEDALJONGENE: fjesene knytter hver sone til spilleren sin. De henger
     UTENFOR søylen på store skjermer, slik Arvind tegnet dem, og krymper inn
     i sonens eget hjørne når det ikke er plass. */
  .sone .medaljongstabel {
    position: absolute; z-index: 5; right: calc(100% + clamp(4px, .6vw, 9px));
    top: 50%; transform: translateY(-50%);
    display: flex; flex-direction: column; gap: 3px; align-items: center;
  }
  /* MEDALJONGEN slik den er i skissen: en blå skive i samme familie som
     rommet, en TYKK hvit ring, og en myk hvit glød utenfor det igjen. Ikke
     en kremhvit knapp — den var min oppfinnelse, ikke hans. */
  .medaljong {
    --mstr: clamp(26px, 3.1vw, 50px);
    width: var(--mstr); height: var(--mstr); flex: 0 0 auto;
    border-radius: 50%; padding: 4%;
    background: radial-gradient(circle at 42% 30%, #e2ecff 0%, #b3cbfb 52%, #7f9fe8 100%);
    box-shadow:
      0 0 0 clamp(2.5px, .45vh, 6px) #fff,
      0 0 18px rgba(255,255,255,.7), 0 0 46px rgba(170,205,255,.55);
  }
  .medaljong .fjes { display: block; width: 100%; height: 100%; }
  .medaljong.deg { background: radial-gradient(circle at 42% 30%, #ffd9d2 0%, #ff9d8d 55%, #f2382c 100%); }
  .medaljong.kommer { animation: medalje-inn .8s var(--sprett) both; }
  @keyframes medalje-inn {
    0% { opacity: 0; transform: translateY(-160%) scale(.4) rotate(-24deg); }
    60% { opacity: 1; transform: translateY(6%) scale(1.14) rotate(4deg); }
    100% { opacity: 1; transform: none; }
  }

  /* SAMMENSLÅINGEN. Makkeren er funnet: hans sone forsvinner, medaljongen
     hans faller ned i den blå, og den blå svelger — man skal SE at to
     kontoer ble til én, ikke oppdage at tallet plutselig er et annet. */
  .sone.svelger { animation: sone-svelg .82s var(--sprett) both; }
  @keyframes sone-svelg {
    0% { transform: scaleY(.72); transform-origin: 50% 100%; }
    46% { transform: scaleY(1.05); transform-origin: 50% 100%; box-shadow: inset 0 0 0 2px #fff, 0 0 30px rgba(255,255,255,.5); }
    100% { transform: scaleY(1); transform-origin: 50% 100%; }
  }
  .stikksoyle .treff { animation: treffslag .5s var(--sprett); }

  /* ================== BORDET: TRE MOTSTANDERE OVERFOR DEG =================
     ARVIND: «jeg ser for meg at man ser de 3 motstanderene sitte overfor
     bordet (franklin, lincon, trump) og man ser hva kort de legger ut.»

     Det er en annen romfølelse enn den forrige. Før satt de tre rundt et
     rutenett — én til venstre, én øverst, én til høyre — som er kortbordet
     sett rett ovenfra. Nå sitter de PÅ RAD OVERFOR deg, som når man ser opp
     fra sin egen hånd, og kortet hver av dem legger ligger foran ham i
     perspektiv. Formatet er iPad liggende, og det er den formen som utnytter
     det.

     PERSPEKTIVET LIGGER PÅ INNPAKNINGEN, ikke på kortet. `.bordkort` vippes
     med `rotateX`; kortet inni beholder sine egne animasjoner (innlegging,
     vinnerslag, innsamling). Setter man begge på samme element, slår
     innsamlingens inline-`transform` ut vippingen og kortet retter seg opp
     med et rykk midt i flyvningen. */
  .bord {
    position: relative; min-height: 0; min-width: 0;
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    grid-template-columns: minmax(0, 1fr);
    justify-items: center; align-items: center;
    gap: clamp(2px, .8vh, 10px);
    perspective: 1100px;
  }
  .motstandere {
    grid-row: 1; width: 100%;
    display: grid; grid-template-columns: repeat(3, minmax(0, 1fr));
    align-items: start; justify-items: center;
    gap: clamp(4px, 1.4vw, 30px);
  }
  .motspiller {
    display: flex; flex-direction: column; align-items: center; min-width: 0;
    gap: clamp(2px, .7vh, 8px);
  }
  .motspiller .hode { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .motspiller .medaljong { --mstr: clamp(40px, 5.6vw, 96px); }
  /**
   * NAVNET LIGGER PÅ EN FLATE, IKKE PÅ ROMMET.
   *
   * Her sto hvit tekst rett på bakgrunnen med en skygge under. Det gikk så
   * lenge rommet var mørkt overalt — men rommet lysner nå mot kantene, og
   * Franklin og Trump sitter nettopp der. Målt: kontrasten kunne ikke engang
   * regnes ut, fordi flaten under teksten går fra #1a2fe0 til nesten hvitt.
   * En tekstskygge er ikke et svar på det; den gjør bokstaven tykkere, ikke
   * flaten mørkere.
   */
  .motspiller .navn {
    font-size: clamp(10px, .62em, 22px); font-weight: 800; letter-spacing: .09em;
    text-transform: uppercase; color: var(--tekst); white-space: nowrap;
    background: var(--flate); border-radius: 999px; padding: .12em .7em .16em;
    box-shadow: var(--topplys), var(--fall-1);
  }
  .motspiller .igjen {
    font-size: .56em; font-weight: 700; letter-spacing: .06em; text-transform: uppercase;
    color: var(--tekst-2); white-space: nowrap;
    background: var(--flate-dyp); border-radius: 999px; padding: .06em .55em .1em;
  }
  .motspiller .igjen:empty { background: none; padding: 0; }
  /* Kortet han la, i perspektiv — «litt vridd og skråstilt, som kort som
     faktisk er kastet ut på et bord». Vippingen ligger på PLASSEN og ikke på
     kortet, slik at den tomme flaten står i samme perspektiv som kortet som
     kommer; ellers rettet plassen seg opp i det kortet ble lagt. */
  .kortplass { display: grid; place-items: center; min-height: 0; }
  .motspiller .kortplass {
    transform: rotateX(24deg) rotate(var(--vri, 0deg));
    transform-origin: 50% 0%;
  }
  .dinplass { grid-row: 3; display: grid; place-items: center; }
  .dinplass .kortplass { transform: rotateX(13deg) rotate(-3deg); transform-origin: 50% 100%; }
  /* Tom plass: en antydet kortflate, slik at ingenting hopper når kortet
     kommer. Uten den flyttet hele raden seg hver gang noen la et kort. */
  .tomplass {
    /* SAMME MÅL SOM `.kort.liten`. Er de ulike, hopper raden i det øyeblikket
       kortet legges — og et bord som hopper hvert eneste stikk er verre enn
       et bord uten plassholder i det hele tatt. */
    width: var(--tomb, clamp(44px, 4.6vw + 3.2vh, 96px));
    aspect-ratio: 2.5 / 3.5;
    border-radius: clamp(6px, .9vh, 12px);
border: 0;
    background: radial-gradient(ellipse at 42% 32%, rgba(8,20,90,.16), rgba(8,20,90,.05) 70%, transparent 100%);
    box-shadow: inset 1px 2px 8px rgba(6,16,70,.18);
  }
  .bordkort { display: flex; flex-direction: column; align-items: center; gap: 3px; min-width: 0; position: relative; }
  .bordkort .hvem {
    font-weight: 700; font-size: .68em; letter-spacing: .06em; text-transform: uppercase;
    white-space: nowrap; color: var(--tekst-3);
    transition: color .28s var(--myk), opacity .28s var(--myk);
  }
  .midtfelt { grid-row: 2; display: flex; flex-direction: column; align-items: center; gap: 7px; }

  .trumfskilt, .etterlyst {
    display: flex; align-items: center; gap: .5em; flex-wrap: wrap; justify-content: center;
    background: var(--flate); border: 1px solid var(--hinne);
    box-shadow: var(--topplys), var(--loft-1);
    border-radius: 999px; padding: .2em .8em .24em .6em; font-size: .8em; font-weight: 700;
  }
  .trumfskilt.inn, .etterlyst.inn { animation: skilt-inn .38s var(--sprett) both; }
  @keyframes skilt-inn { from { opacity: 0; transform: translateY(6px) scale(.92); } }
  .trumfskilt .stjerne { width: 1.15em; height: 1.15em; }
  .merkelapp { color: var(--tekst-3); font-weight: 700; letter-spacing: .1em; font-size: .82em; text-transform: uppercase; }
  .etterlyst { font-size: .76em; }

  /* DIN TUR. Det høyeste punktet i hierarkiet når det gjelder — ingenting
     annet på skjermen skal rope like høyt. Pulsen er lav og treg; den skal
     kunne stå i tjue sekunder uten å bli irriterende. */
  .dintur {
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 55%, #86180d 100%);
    color: #fff; font-weight: 800; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 999px; padding: .3em 1.15em; font-size: .78em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 4px 18px rgba(232,80,63,.5);
    animation: dintur-puls 2.6s ease-in-out 1s infinite;
  }
  .dintur.inn { animation: dintur-inn .42s var(--sprett) both, dintur-puls 2.6s ease-in-out 1s infinite; }
  @keyframes dintur-inn { from { opacity: 0; transform: scale(.8); } }
  @keyframes dintur-puls {
    0%, 100% { box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 4px 18px rgba(232,80,63,.5); }
    50% { box-shadow: inset 0 1px 0 rgba(255,255,255,.42), 0 4px 26px rgba(232,80,63,.85); }
  }

  .tenker {
    display: inline-flex; align-items: center; gap: .5em;
    background: var(--flate); border: 1px solid var(--hinne);
    box-shadow: var(--topplys), var(--loft-1);
    border-radius: 999px; padding: .18em .7em; font-size: .58em; font-weight: 700;
    letter-spacing: .05em; text-transform: uppercase; white-space: nowrap;
  }
  /* Utenfor spillfasen (bud, vrak, trumfvalg) står bobla midt på bordet. */
  .midtfelt .tenker { font-size: .78em; text-transform: none; letter-spacing: 0; }
  .prikker { display: inline-flex; gap: 3px; }
  .prikker i { width: .32em; height: .32em; border-radius: 50%; background: var(--korall-lys);
               animation: hopp 1.1s ease-in-out infinite; }
  .prikker i:nth-child(2) { animation-delay: .16s; }
  .prikker i:nth-child(3) { animation-delay: .32s; }
  @keyframes hopp { 0%, 60%, 100% { opacity: .3; transform: translateY(0); }
                    30% { opacity: 1; transform: translateY(-.28em); } }

  .forrige {
    position: absolute; right: 0; top: 0; z-index: 2;
    background: var(--flate-dyp); border: 1px solid rgba(132,178,248,.14);
    box-shadow: var(--loft-1);
    border-radius: var(--rad-s); padding: .35em .5em; text-align: center;
    font-size: .6em; max-width: 42%;
  }
  .forrige.inn { animation: forrige-inn .34s var(--myk) both; }
  @keyframes forrige-inn { from { opacity: 0; transform: translateX(10px); } }
  .forrige .tittel { color: var(--tekst-3); margin-bottom: 3px; white-space: nowrap;
                     letter-spacing: .08em; text-transform: uppercase; font-size: .92em; }
  .forrige .tittel b { color: var(--korall-lys); }
  .forrige .rad { display: flex; gap: 3px; justify-content: center; }
  .forrige .navn { color: var(--tekst-3); font-size: .88em; }

  /* ================== KORT ===============================================
     EKTE KORTPROPORSJONER: 2,5 × 3,5 tommer, altså 0,714. */
  .kort {
    width: var(--kb, var(--kort-maks));
    aspect-ratio: 2.5 / 3.5;
    background:
      linear-gradient(var(--lysfall), #ffffff 0%, var(--kortflate) 48%, #ece7da 100%);
    color: var(--f, var(--s-blekk));
    /* INGEN RAMME. Skissens kort er håndtegnede flater med litt ujevne
       kanter og en myk skygge — ikke rektangler med strek rundt. Radiene er
       ULIKE i hvert hjørne med vilje; det er hele forskjellen på «tegnet» og
       «generert», og det koster ingenting. */
    border: 0;
    border-radius: clamp(7px,1.1vh,14px) clamp(5px,.8vh,11px)
                   clamp(8px,1.2vh,15px) clamp(6px,.9vh,12px);
    position: relative; cursor: pointer; padding: 0; flex: 0 0 auto;
    font: inherit;
    /* MATT FLATE. Kortet er papir: ingen glans, ingen glød — bare et hint av
       lys langs øvre venstre kant og en skygge som faller ned til høyre. */
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--fall-2);
    transition: transform .2s var(--sprett), box-shadow .2s var(--myk),
                filter .2s var(--myk), opacity .2s var(--myk);
    touch-action: manipulation; user-select: none; -webkit-user-select: none;
    -webkit-touch-callout: none;
    overflow: hidden;
  }
  .kort .hjorne {
    position: absolute; top: 3.5%; left: 6%; text-align: center;
    font-weight: 800; font-size: clamp(14px, calc(.34 * var(--kb, 90px)), 42px);
    line-height: .96; letter-spacing: -.03em;
  }
  .kort .hjorne .sym { display: block; font-size: .96em; letter-spacing: 0; }
  .kort .hjorne.ned { top: auto; left: auto; bottom: 3.5%; right: 6%; transform: rotate(180deg); }
  /* MIDTFIGUREN er ikke lenger en skriftglyf, men den myke, konturløse
     formen fra ikonet. Se `#kf-S` og de tre andre i `<defs>`. */
  .kort .midt {
    position: absolute; inset: 0; display: grid; place-items: center;
    pointer-events: none;
  }
  .kort .midt svg { width: 62%; height: 62%; display: block; }
  @media (max-width: 430px) { .kort .hjorne.ned { display: none; } }

  .kort:not([disabled]):hover { transform: translateY(-1vh) scale(1.05); box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--fall-3); }
  .kort:not([disabled]):active { transform: translateY(-.3vh) scale(.99); }
  .kort:focus-visible { outline: 4px solid var(--korall); outline-offset: 3px; z-index: 3; }
  .kort:not([disabled]):focus-visible { transform: translateY(-1vh) scale(1.05); }
  .kort.valgt { outline: 4px solid var(--korall); outline-offset: 2px; transform: translateY(-1.4vh); z-index: 2; }
  .kort.liten { --kb: clamp(44px, 4.6vw + 3.2vh, 96px); }
  .forrige .kort { --kb: clamp(26px, 3.4vh, 44px); border-width: 1px; box-shadow: none; }
  .bordkort .kort[disabled], .forrige .kort[disabled], .rygg.kort { opacity: 1; filter: none; cursor: default; }

  /* KORTBAKSIDEN. Stjerna på kobolt, med en tynn kremramme slik ekte
     kortrygger har. */
  .kort.rygg {
    background:
      radial-gradient(ellipse at 50% 38%, #3d61f2 0%, #1a2fe0 58%, #0d1a90 100%);
    cursor: default; display: grid; place-items: center;
    box-shadow: 0 0 0 3px rgba(255,255,255,.85), 0 2px 12px rgba(10,26,110,.45);
  }
  .kort.rygg .stjerne { width: 54%; height: 54%; opacity: .95; }

  /* ================== HÅNDEN SOM HJUL ====================================
     ARVIND: «man kan bla i de som et hjul (eller trykke på pilene) også kan
     man holde på et kort og kaste det ut på bordet (eller trykke på det).»

     ============ HVORFOR VIFTA ER ABSOLUTT PLASSERT ======================

     Den gamle hånden var en `flex-wrap`-rad som brakk til tre rader på
     telefon for å få plass. Det er den motsatte løsningen av den Arvind ber
     om: rader gjør hvert kort MINDRE for at alle skal synes samtidig, mens et
     hjul lar kortene være STORE og heller flytte det man ikke ser bort til
     siden. Hjulet krever at kortene ligger på hver sin målte plass, og det
     kan en flex-rad ikke gi.

     ============ HVORFOR `translate`/`rotate` OG IKKE `transform` =========

     Kortet har fra før `transform` på `:hover`, `:active`, `:focus-visible`
     og `.valgt`. Skrev vifta seg inn i `transform` også, ville det ene
     overskrevet det andre — et kort man holdt musa over ville hoppet til
     midten av vifta. `translate` og `rotate` er EGNE egenskaper som
     komponeres FØR `transform`, så vifteplassen og løftet kan leve side om
     side uten at noen av dem må kjenne til den andre. */
  :root { --kort-maks: clamp(56px, 7.2vw + 3.6vh, 132px); --kort-min: 46px; --kort-luft: 4px; }
  .handrad { position: relative; min-width: 0; }
  .hjul {
    /* `z-index: 0` er ikke pynt — det lager en STABLEKONTEKST. Uten den
       konkurrerer kortenes egne z-indekser (opptil 40, satt av `settSenter`)
       direkte med pilene, og pilene forsvant bak vifta på nøyaktig de
       skjermene der de trengs mest. */
    position: relative; z-index: 0; min-width: 0; overflow: hidden;
    /* Kortets høyde + bøyens utslag + litt luft. `--bue` settes fra
       `oppdaterHjul()`, som er det eneste stedet som VET hvor mye vifta
       bøyer — se kommentaren der. */
    height: calc(var(--kb, 100px) / 0.714 + var(--bue, 20px) + clamp(10px, 1.8vh, 22px));
    /* HELE gestbehandlingen er vår. Uten dette tolker nettleseren et sveip
       som panorering og stjeler pekeren midt i blaingen. */
    touch-action: none;
    -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
  }
  .hjul .kort {
    position: absolute; left: 50%;
    /* BØYEN GÅR NEDOVER, så luften den trenger må ligge UNDER kortet — ikke
       over. Her sto `bottom: 11px` mens `--bue` ble lagt til beholderens
       HØYDE, altså i toppen: ytterkortene bøyde seg rett ut av bunnen og ble
       klippet på tvers. Nå starter kortet `--bue` høyere, og bøyen lander
       nøyaktig i den luften. */
    bottom: calc(var(--bue, 20px) + clamp(4px, 1.4vh, 14px));
    /* `touch-action` arves ikke: står den ikke også på kortet, gjelder
       kortets egen `manipulation` for berøringer som starter der — altså
       nesten alle. */
    touch-action: none;
    --d: calc(var(--i) - var(--senter, 0));
    /* Bøyen er `d²`, ikke `abs(d)`: `abs()` i CSS er ny nok til at eldre
       iPad-Safari ikke har den, og et kvadrat gir dessuten den buen en
       vifte faktisk har. */
    /* `min()` er ikke pynt her heller: kortene UTENFOR vinduet har vilkårlig
       stor `d`, og et kvadrat vokser fort. Uten taket falt de 80 px under
       beholderen — de er klippet vannrett uansett, men bøyen dro dem også
       nedover forbi skjermkanten på vei ut. */
    translate:
      calc(-50% + var(--d) * var(--steg, 60px) + var(--dx, 0px))
      calc(min(var(--boymaks, 20px), var(--d) * var(--d) * var(--boy, 1.6px)) + var(--dy, 0px));
    rotate: calc(var(--d) * var(--vinkel, 3deg));
    transition: translate .34s var(--myk), rotate .34s var(--myk),
                transform .2s var(--sprett), box-shadow .2s var(--myk),
                opacity .2s var(--myk), filter .2s var(--myk);
  }
  /* Under fingeren: ingen etterslep, ellers føles kortet som om det henger
     fast i sirup. Snappen slås på igjen når fingeren slipper. */
  .hjul.drar .kort { transition: none; }
  .hjul .kort.griper { z-index: 60 !important; box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--fall-3); }
  /* Passert kastegrensen: kortet lyser opp, og bordet svarer. */
  .hjul .kort.kaster { box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--glo-korall), var(--fall-3); }
  /* .94 og ikke lavere: forskjellen skal bæres av HØYDEN og skyggen, ikke av
     at kortet blekner. Blir det for svakt, faller lesbarheten med det — og
     det var nettopp den feilen runde 1 rettet. */
  /**
   * ============ ET `disabled` KORT SVELGER FINGEREN ====================
   *
   * Nettleseren sender INGEN pekerhendelser fra en deaktivert knapp — ikke
   * engang `pointerdown`, og ikke til forelderen heller. Hjulets lytter
   * ligger på `.hjul`, så et sveip som TILFELDIGVIS begynte oppå et ulovlig
   * kort ble aldri sett i det hele tatt.
   *
   * Det er ikke en sjelden hjørnesituasjon. Midt i en runde er de fleste
   * kortene på hånden ulovlige, og på telefon dekker de nesten hele
   * hjulflaten. Målt i nettleseren: sveip på telefon flyttet ikke vifta én
   * eneste plass, mens den samme sveipen på iPad — der hånden er låst og
   * ingen blaing skjer uansett — så helt riktig ut. Nøyaktig den feilen
   * Arvind advarte mot: gesten blir feil når man navigerer.
   *
   * `pointer-events: none` lar fingeren gå TVERS IGJENNOM kortet ned til
   * hjulet. Blaing virker overalt; et trykk på et ulovlig kort gjør fortsatt
   * ingenting, som det skal.
   */
  .hjul .kort[disabled] {
    opacity: .94; pointer-events: none;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.8), var(--fall-1);
  }
  /* SPILLBART = LØFTET OG LYSERE, ikke en ring rundt. Ringen var et
     effektlag: den sa det samme som høyden allerede sier. */
  .hjul .kort:not([disabled]) {
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.95), var(--fall-3);
  }
  .hjul .kort[disabled] { filter: saturate(.9) brightness(.97); }
  /* «passiv» = kortene er ikke valgbare fordi et panel har ordet, ikke fordi
     de er ulovlige. Da skal de stå rolig og fullt lesbare. */
  .hjul.passiv .kort[disabled] { opacity: 1; filter: none; box-shadow: inset 1px 1px 0 rgba(255,255,255,.9), var(--fall-2); }

  /* PILENE. «Røde piler ytterst til venstre og høyre for å bla.» De ligger
     OVER viftekantene, slik de er tegnet, og er egne knapper — den som ikke
     vil sveipe skal slippe å lære en gest for å spille kort. */
  /* PILENE er i skissen store, myke røde piler som ligger rett på flaten —
     ingen knappeflate rundt, ingen ramme. Trykkflaten er likevel 48 px+, som
     er kravet; den er bare usynlig. */
  .blapil {
    position: absolute; top: 50%; transform: translateY(-50%); z-index: 8;
    width: clamp(52px, 5.6vw, 78px); height: clamp(56px, 11vh, 118px);
    display: grid; place-items: center; padding: 0; cursor: pointer;
    border: 0; border-radius: 999px; touch-action: manipulation;
    background: none;
    transition: opacity .2s var(--myk), transform .16s var(--sprett), filter .18s var(--myk);
    filter: drop-shadow(3px 5px 10px rgba(10,26,110,.55));
  }
  .blapil.venstre { left: 0; }
  .blapil.hoyre { right: 0; }
  .blapil .pil { display: block; width: 100%; height: 100%; }
  .blapil.hoyre .pil { transform: scaleX(-1); }
  .blapil:hover:not([disabled]) { filter: drop-shadow(4px 7px 14px rgba(10,26,110,.6)) brightness(1.08); }
  .blapil:active:not([disabled]) { transform: translateY(-50%) scale(.92); }
  .blapil:focus-visible { outline: 4px solid #fff; outline-offset: 2px; }
  .blapil[disabled] { opacity: 0; pointer-events: none; }

  /* Kasteflaten: bordet svarer mens et kort dras opp mot det. */
  .bord.tarimot { outline: 3px dashed rgba(255,138,118,.55); outline-offset: -6px; border-radius: var(--rad-l); }

  /* ================== ANIMASJONER =======================================
     ARVIND: «de animasjonene for utspill er også ikke polert, og det viser
     aldri hvem som får stikket med en animasjon.»

     Det første er tempo og easing. Det andre var en ekte feil, og den er
     verdt å skrive ned: kortene GLED til vinneren, men de landet OPPÅ
     hverandre under vinnerens eget kort og falmet til 0,5 — så det som
     faktisk ble sett var at kortene forsvant, ikke at de gikk et sted. En
     måling som sa «408 px flyttet» var sann og svarte likevel ikke på om noen
     så det.

     Nå LANDER de: bunken legger seg i vifte rundt vinnerens kort, i full
     dekkevne, med en liten støt-effekt når den treffer. Og etterpå spretter
     et stikkmerke ut av bunken og flyr inn i lagbaren, slik at man ser stikket
     bli til framdrift mot kontrakten. */
  /* Motstanderens kort faller ned FRA HAM; ditt eget kastes opp fra hånden.
     Retningen er nå gitt av hvor spilleren sitter, ikke av en plassklasse. */
  .bordkort .kort.ny { animation: legges .44s var(--sprett) both; }
  .motspiller .bordkort .kort.ny { animation-name: fra-eier; }
  .dinplass   .bordkort .kort.ny { animation-name: fra-haanden; }
  @keyframes legges     { from { opacity: 0; transform: scale(.86); } }
  @keyframes fra-eier    { from { opacity: 0; transform: translateY(-160%) rotate(-8deg) scale(.86); } }
  @keyframes fra-haanden { from { opacity: 0; transform: translateY(210%)  rotate(7deg)  scale(.86); } }

  /* Stikket er avgjort: vinnerkortet løftes og lyser, taperne trekker seg
     tilbake. Forskjellen skal kunne ses fra sofaen, ikke leses. */
  .bord.avgjort .bordkort:not(.vant) .kort { transform: scale(.9); filter: brightness(.68) saturate(.7); }
  .bord.avgjort .bordkort:not(.vant) .hvem { opacity: .35; }
  .bordkort.vant .kort {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.95), var(--glo-korall), var(--loft-3);
    animation: vinnerslag .62s var(--sprett) both;
    z-index: 4;
  }
  @keyframes vinnerslag {
    0% { transform: scale(1); }
    42% { transform: scale(1.16) translateY(-4%); }
    100% { transform: scale(1.08) translateY(-2%); }
  }
  /* Setet lyser opp der stikket havner. */
  .seteglans {
    position: absolute; left: 50%; top: 50%; width: 260%; height: 260%;
    transform: translate(-50%, -50%); pointer-events: none; z-index: -1;
    background: radial-gradient(circle at 50% 50%,
      rgba(232,80,63,.42) 0%, rgba(232,80,63,.16) 34%, rgba(232,80,63,0) 66%);
    animation: glans .95s var(--myk) both;
  }
  @keyframes glans {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(.3); }
    45% { opacity: 1; transform: translate(-50%, -50%) scale(1.05); }
    100% { opacity: .55; transform: translate(-50%, -50%) scale(1); }
  }
  /* Vinnerskiltet står OVER kortet, ikke bak det. Før vokste kortet opp i sin
     egen etikett og dekket halve ordet. */
  .vinnerband {
    display: inline-flex; align-items: center; gap: .35em;
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 60%, #86180d 100%);
    color: #fff; font-weight: 800; font-size: .92em; letter-spacing: .06em; text-transform: uppercase;
    border-radius: 999px; padding: .16em .7em .2em;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.45), 0 3px 16px rgba(232,80,63,.6);
    animation: band-inn .5s var(--sprett) both;
    position: relative; z-index: 5;
  }
  .vinnerband .stjerne { width: .95em; height: .95em; }
  @keyframes band-inn { from { opacity: 0; transform: translateY(6px) scale(.6); } }

  /* Innsamlingen. Flyttingen settes som inline `transform` fra app.ts, som
     måler de faktiske posisjonene — seksten kombinasjoner av vinner og plass
     ville ellers vært gjetninger om et rutenett som endrer seg med skjermen. */
  .bord.samler .bordkort .kort {
    transition: transform .52s var(--ut-inn), opacity .3s ease .5s;
  }
  .bord.samler .bordkort .hvem { transition: opacity .3s; opacity: 0; }
  .bord.samler .bordkort.vant .hvem { opacity: 1; }
  .bord.samler .bordkort.vant .kort { animation: none; }
  /* Støtet når bunken lander. */
  .bord.landet .bordkort.vant .kort { animation: nedslag .38s var(--sprett) both; }
  @keyframes nedslag {
    0% { transform: scale(1.08) translateY(-2%); }
    40% { transform: scale(1.18) translateY(-1%); }
    100% { transform: scale(1.06) translateY(-2%); }
  }

  /* Stikkmerket som flyr fra bunken inn i lagbaren. */
  .flygemerke {
    position: fixed; z-index: 40; pointer-events: none;
    display: inline-flex; align-items: center; justify-content: center;
    min-width: 2em; height: 2em; padding: 0 .5em;
    border-radius: 999px; font: 800 clamp(14px, 2vh, 22px)/1 var(--sans);
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 60%, #86180d 100%);
    color: #fff; box-shadow: inset 0 1px 0 rgba(255,255,255,.5), 0 6px 24px rgba(232,80,63,.7);
  }
  .lagbar.treff, .brikke.treff { animation: treffslag .5s var(--sprett); }
  @keyframes treffslag {
    0% { transform: scale(1); }
    40% { transform: scale(1.06); }
    100% { transform: scale(1); }
  }

  @media (prefers-reduced-motion: reduce) {
    .overlegg.fersk, .overlegg.fersk .panel, .bordkort .kort.ny,
    .kontrakt.inn, .trumfskilt.inn, .etterlyst.inn, .dintur, .dintur.inn,
    .forrige.inn, .vinnerband,
    .seteglans, .celle.ny, .tavle .itur::after, .tavle b.endret,
    .sone.svelger, .medaljong.kommer, .sone .tall.slag,
    .bordkort.vant .kort, .bord.landet .bordkort.vant .kort,
    .rom .skinn, .laster .stjerne, .prikker i, .stikksoyle .treff {
      animation: none !important;
    }
    .bord.samler .bordkort .kort { transition: none; }
    .kort, .celle, .bordkort .hvem, .stikksoyle { transition: none; }
    /* Hjulet skal fortsatt kunne blas — det er navigasjon, ikke pynt. Men
       det skjer uten glid: kortet står der det skal med én gang. */
    .hjul .kort { transition: none; }
    .seteglans { opacity: .55; }
  }

  /* ================== PANELER ============================================ */
  /* HVER SKJERM ARVER SIGNATUREN. Her sto et mørkt slør — det er den vanlige
     modal-oppskriften, og den gjorde at startskjermen, budpanelet og
     rundeoppgjøret så ut som en annen app enn bordet. */
  .overlegg {
    position: fixed; inset: 0; z-index: 10;
    display: grid; place-items: center; padding: 12px;
    background: var(--rom-fall-slor);
    backdrop-filter: blur(5px);
  }
  .overlegg.fersk { animation: tone .2s ease-out; }
  .overlegg.fersk .panel { animation: opp .34s var(--sprett); }
  @keyframes tone { from { opacity: 0; } }
  @keyframes opp { from { opacity: 0; transform: translateY(16px) scale(.94); } }
  .panel {
    background: var(--panelflate);
    border: 0; border-radius: clamp(18px, 3vh, 32px);
    padding: clamp(16px, 2.8vh, 32px) clamp(18px, 2.8vw, 40px);
    width: fit-content; min-width: min(280px, 92vw);
    max-width: min(96vw, 900px); max-height: min(94vh, 94dvh); overflow: auto;
    /* Lyset oppe til venstre, skyggen ned til høyre — samme regel som alt
       annet. Korallstripa langs toppen er strøket: den var en hard kant i et
       design der ingenting har harde kanter. */
    box-shadow: inset 2px 2px 0 rgba(255,255,255,.26), var(--fall-3);
    text-align: center; position: relative;
  }
  .panel h1 { font-family: var(--slab); font-weight: 400; font-size: clamp(1.5em, 3.4vh, 2.3em);
              margin: 0 0 .3em; letter-spacing: .01em; line-height: 1.05; }
  .panel h2 { font-size: clamp(1.05em, 2vh, 1.4em); margin: 0 0 .7em; line-height: 1.3; font-weight: 800; }
  .knapper { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }

  button.stor {
    font: inherit; font-size: clamp(.95em, 1.7vh, 1.25em); font-weight: 800;
    min-width: 3.4em; min-height: 48px; padding: .45em .95em;
    border-radius: var(--rad); border: 0; cursor: pointer;
    background: linear-gradient(var(--lysfall), var(--kobolt-700) 0%, var(--kobolt-950) 100%);
    color: #fff; touch-action: manipulation;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.26), var(--fall-1);
    transition: transform .14s var(--sprett), box-shadow .18s var(--myk), filter .18s var(--myk);
  }
  button.stor:hover { filter: brightness(1.16); box-shadow: inset 1px 1px 0 rgba(255,255,255,.3), var(--fall-2); transform: translateY(-2px); }
  button.stor:active { transform: translateY(1px) scale(.985); box-shadow: inset 0 2px 5px rgba(0,0,0,.4); }
  button.stor:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 2px; }
  button.stor[disabled] { opacity: .4; cursor: default; }
  button.stor[disabled]:hover { filter: none; transform: none; }
  button.pass { background: linear-gradient(var(--lysfall), #7d3c33 0%, #3d1d19 100%); }
  button.spesial { background: linear-gradient(var(--lysfall), #d8331f 0%, #6e1f14 100%); }
  button.bekreft {
    background: linear-gradient(var(--lysfall), #d8331f 0%, #b52314 52%, #86180d 100%);
    font-size: clamp(1.05em, 2vh, 1.45em);
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.5), var(--fall-2);
  }

  /* ---- Trumfvelgeren: fire KORT ------------------------------------------ */
  .trumfvalg { display: flex; flex-wrap: wrap; gap: clamp(8px, 1.6vw, 18px); justify-content: center; }
  button.trumfkort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(var(--lysfall), #ffffff 0%, var(--kortflate) 100%); color: var(--f);
    border: 0; border-radius: var(--rad);
    padding: 0; overflow: hidden;
    width: clamp(84px, 17vw, 150px); min-height: 96px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .1em;
    box-shadow: inset 1px 1px 0 rgba(255,255,255,.95), var(--fall-2);
    transition: transform .18s var(--sprett), box-shadow .18s var(--myk);
  }
  button.trumfkort .stripe { display: block; width: 100%; height: 10px; background: var(--f); }
  button.trumfkort .tsym {
    display: block; width: clamp(46px, 8vh, 82px); height: clamp(46px, 8vh, 82px);
    margin-top: .1em;
  }
  button.trumfkort .tsym svg { display: block; width: 100%; height: 100%; }
  button.trumfkort .tnavn { font-size: clamp(13px, 1.7vh, 19px); font-weight: 800; color: #3a3f46; margin-bottom: .45em; }
  button.trumfkort:hover { transform: translateY(-6px) scale(1.03); box-shadow: inset 0 1px 0 rgba(255,255,255,.95), var(--loft-3), 0 0 0 1px rgba(255,138,118,.5); }
  button.trumfkort:active { transform: translateY(-1px) scale(.99); }
  button.trumfkort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 3px; }

  /* ---- Etterlysningen: MINIKORT ------------------------------------------ */
  .etterlysrad { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: .6em 0 1em; }
  button.minikort {
    font: inherit; cursor: pointer; touch-action: manipulation;
    background: linear-gradient(var(--lysfall), #ffffff 0%, var(--kortflate) 100%); color: var(--f);
    border: 0; border-radius: 9px;
    min-width: 48px; min-height: 60px; padding: .2em .3em;
    display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05;
    font-weight: 800; box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--loft-1);
    transition: transform .16s var(--sprett), box-shadow .16s var(--myk);
  }
  button.minikort .v { font-size: clamp(17px, 2.3vh, 24px); }
  button.minikort .sym { font-size: clamp(15px, 2vh, 22px); }
  button.minikort:hover { transform: translateY(-5px) scale(1.04); box-shadow: inset 0 1px 0 rgba(255,255,255,.9), var(--loft-2), 0 0 0 1px rgba(255,138,118,.55); }
  button.minikort:active { transform: translateY(0) scale(.98); }
  button.minikort:focus-visible { outline: 4px solid var(--korall-lys); outline-offset: 2px; }

  .vrakhånd { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-bottom: 1em; }
  .vrakhånd .kort { --kb: clamp(48px, 4.6vw + 3.4vh, 104px); }

  .bekreftlinje { font-size: clamp(1em, 2vh, 1.3em); margin: .5em 0 .9em; line-height: 1.6; }
  .bekreftsmatt { opacity: .8; font-size: .82em; color: var(--tekst-2); font-weight: 400; }
  h2 .bekreftsmatt { display: block; margin-top: .25em; }

  /* Utfallet av runden: form og farge, ikke et emoji. */
  .utfall {
    display: inline-flex; align-items: center; gap: .4em;
    border-radius: 999px; padding: .12em .8em .16em; font-size: .78em;
    font-weight: 800; letter-spacing: .1em; text-transform: uppercase;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.4), var(--loft-1);
  }
  .utfall.ja { background: linear-gradient(180deg, #63e39a 0%, #2f9c5f 100%); color: #04240f; }
  .utfall.nei { background: linear-gradient(180deg, var(--korall-lys) 0%, var(--korall-dyp) 100%); color: #fff; }

  .resultat h2 { font-size: clamp(1.05em, 2.2vh, 1.5em); }
  .resultat h2 .stjerne { display: inline-block; width: .9em; height: .9em; vertical-align: -.06em; margin: 0 .3em; }
  .resultat h2 .utfall { vertical-align: .1em; }
  .delta { display: flex; gap: clamp(8px, 2vw, 24px); justify-content: center;
           font-size: clamp(.9em, 1.8vh, 1.2em); margin: 1em 0 1.2em; flex-wrap: wrap; }
  .delta span { display: inline-flex; gap: .4em; align-items: baseline; }
  .delta .pluss b { color: var(--ok); } .delta .minus b { color: var(--minus); }
  .delta .navn { color: var(--tekst-3); font-size: .84em; }
  .lite { font-size: .72em; color: var(--tekst-3); } .lite a { color: var(--kobolt-200); }

  /* ---- Startskjermen ----------------------------------------------------- */
  .start .ordmerke {
    font-family: var(--slab); font-weight: 400;
    font-size: clamp(28px, 6.4vh, 58px); line-height: 1; letter-spacing: .005em;
    color: var(--krem); margin: 0 0 .7em;
    text-shadow: 0 2px 0 var(--korall-dyp), 0 4px 18px rgba(2,8,24,.7);
  }
  .start .ordmerke .demo {
    display: block; font-family: var(--sans); font-weight: 800;
    font-size: .3em; letter-spacing: .32em; text-transform: uppercase;
    color: var(--korall-lys); text-shadow: none; margin-top: .5em;
  }
  .kortvifte { display: flex; justify-content: center; margin-bottom: .7em; }
  .kortvifte .kort { --kb: clamp(46px, 9vh, 78px); margin-left: -18%; }
  .kortvifte .kort:first-child { margin-left: 0; transform: rotate(-13deg); }
  .kortvifte .kort:last-child { transform: rotate(13deg); }
  .start input {
    font: inherit; font-size: 1.05em; padding: .5em .8em; border-radius: var(--rad-s);
    border: 0;
    background: linear-gradient(var(--lysfall), rgba(6,14,70,.62) 0%, rgba(4,10,50,.44) 100%);
    box-shadow: inset 2px 2px 7px rgba(0,0,0,.4);
    color: #fff;
    margin: 0 0 1.1em; width: 13em; max-width: 100%; min-height: 52px; text-align: center;
    transition: box-shadow .2s var(--myk), border-color .2s var(--myk);
  }
  .start input::placeholder { color: var(--tekst-3); }
  .start input:focus-visible { outline: none; border-color: var(--korall);
    box-shadow: inset 0 2px 6px rgba(0,0,0,.4), 0 0 0 3px rgba(232,80,63,.45); }

  /* Lasteindikatoren: tre stjerner som slår, ikke en generisk stripe. */
  .laster { display: flex; flex-direction: column; align-items: center; gap: .9em; }
  .laster .stjerner { display: flex; gap: .5em; }
  .laster .stjerne { width: 1.6em; height: 1.6em; animation: blink 1.25s ease-in-out infinite; }
  .laster .stjerne:nth-child(2) { animation-delay: .18s; }
  .laster .stjerne:nth-child(3) { animation-delay: .36s; }
  @keyframes blink { 0%, 65%, 100% { opacity: .22; transform: scale(.86); }
                     32% { opacity: 1; transform: scale(1.04); } }

  /* Utrullingsvarselet. Se `<script>` nederst i fila. */
  #versjonsvarsel {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 90;
    background: linear-gradient(180deg, var(--korall) 0%, var(--korall-dyp) 100%);
    color: #fff; font: 600 14px/1.4 var(--sans); text-align: center;
    padding: 10px 14px; box-shadow: 0 -4px 20px rgba(0,0,0,.5);
  }

  /* ================= LAV SKJERM = LIGGENDE TELEFON =======================
     Står SIST i fila med vilje: regler som skal overstyre må komme etter det
     de overstyrer, ellers taper de på lik spesifisitet. */
  @media (max-height: 500px) {
    .kort.liten { --kb: clamp(34px, 9vh, 60px); }
    .bordkort .hvem { font-size: .58em; }
    .trumfskilt { display: none; }
    .etterlyst, .dintur { font-size: .66em; }
    .midtfelt { gap: 3px; }
    .forrige { display: none; }
    .motspiller .medaljong { --mstr: clamp(30px, 8.4vh, 52px); }
    .motspiller .igjen { display: none; }
    .tomplass { --tomb: clamp(30px, 8vh, 52px); }
    .rom .stjerne { width: 22vh; height: 22vh; }
  }
  /* ============ NÅR SØYLEN IKKE HAR PLASS TIL MEDALJONGENE UTENFOR =======
     På smale skjermer flytter fjesene INN i sitt eget sonehjørne i stedet
     for å henge utenfor. Ingenting forsvinner — det er nettopp poenget: uten
     fjeset ville sonen bare vært en farge, og farge alene skal aldri være
     eneste skille. */
  @media (max-width: 760px) {
    .stikksoyle { margin-left: 0; width: clamp(40px, 12vw, 68px); }
    .sone .medaljongstabel {
      right: auto; left: 2px; top: 2px; transform: none; flex-direction: row;
    }
    /* Den blå sonen har budnivåstreken langs sin egen overkant. Fjesene må
       under den, ellers dekker de nettopp det tallet streken finnes for. */
    .sone.blaa .medaljongstabel { top: clamp(11px, 1.8vh, 15px); }
    .medaljong { --mstr: clamp(19px, 5.4vw, 30px); box-shadow: 0 0 0 2px #fff, 0 2px 8px rgba(2,8,24,.8); }
    .sone .tall { font-size: clamp(11px, 3vw, 15px); }
  }
  @media (max-width: 560px) {
    .forrige { font-size: .54em; max-width: 54%; }
    .runde { display: none; }
    .tavle .spiller { padding: .2em .45em .24em; min-width: 2.9em; }
    .motspiller .navn { font-size: clamp(9px, 2.6vw, 13px); letter-spacing: .04em; }
    .blapil { width: 40px; height: clamp(50px, 9vh, 76px); }
  }
</style>
</head>
<body>
  <!-- ROMMET. Tre lag som til sammen gir dybde uten å bli et møbel: lyset
       ovenfra, bunngløden der kortene lander, og stjerna som identitet. -->
  <div class="rom" aria-hidden="true">
    <div class="skinn"></div>
    <div class="grunn"></div>
    <svg class="stjerne" viewBox="0 0 100 100"><use href="#stjernemerke"></use></svg>
  </div>
  <div id="app"></div>
  <div id="oppleser" role="status" aria-live="polite"></div>

  <!-- Stjerna, definert én gang. Femtakket, fylt med flaggets røde og hvite
       striper, med koboltkontur — motivet fra appikonet. -->
  <svg class="symboler" aria-hidden="true" focusable="false">
    <defs>
      <!-- ================= AIRBRUSHEN ==================================
           ARVIND, om konseptkunsten: «gradients og lighting som skiller seg
           ut fra det seriøse designet vi har nå.»

           Ikonet hans er ikke flate ikoner. Kortfargene er OPPBLÅSTE — myk
           radial med lyskilde oppe til venstre, mørk underside, runde
           kanter. Som ballonger, ikke som symboler. Tre runder med frontend
           laget flate glyffer fordi det er standardinstinktet; disse
           gradientene er hele forskjellen.

           Brennpunktet står på 33 %/24 % i ALLE fire, slik at lyset kommer
           fra samme kant overalt. Er lyskilden ulik fra figur til figur,
           faller 3D-illusjonen sammen med én gang. -->
      <!-- ============ HARDHETEN ER HELE POENGET ======================
           Første forsøk på å treffe ikonet bommet på nøyaktig én ting, og
           den ene tingen var ikke farge eller motiv: det var KANTEN. Det ble
           skarp 3D med blank høylysflekk og neonkontur — samme motiv, samme
           palett, feil estetikk.

           I Arvinds ikon har figurene INGEN kontur. Lyset kommer inn oppe
           til venstre som en myk overgang tvers over formen, ikke som en
           speilflekk, og selve kanten er litt UTE AV FOKUS. Det er myk
           pensel på lerret, ikke en rendret modell.

           Derfor: skrå lineærgradient (ikke radial med brennpunkt), ingen
           `stroke`, og `feGaussianBlur` på FIGUREN SELV. Uskarpheten er ikke
           en glødeeffekt lagt utenpå — den er formens egen kant. -->
      <linearGradient id="g-koks" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#8f8f8f"></stop>
        <stop offset=".3" stop-color="#5c5c5c"></stop>
        <stop offset=".72" stop-color="#3a3a3a"></stop>
        <stop offset="1" stop-color="#252525"></stop>
      </linearGradient>
      <linearGradient id="g-korall" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#ffa79c"></stop>
        <stop offset=".3" stop-color="#fb6f60"></stop>
        <stop offset=".72" stop-color="#f2382c"></stop>
        <stop offset="1" stop-color="#cf2b20"></stop>
      </linearGradient>
      <linearGradient id="g-kobolt" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#a8c6ff"></stop>
        <stop offset=".3" stop-color="#5f8bf0"></stop>
        <stop offset=".72" stop-color="#2b4fdd"></stop>
        <stop offset="1" stop-color="#16309e"></stop>
      </linearGradient>
      <linearGradient id="g-gronn" x1="12%" y1="6%" x2="88%" y2="96%">
        <stop offset="0" stop-color="#a9e6bd"></stop>
        <stop offset=".3" stop-color="#5cc07d"></stop>
        <stop offset=".72" stop-color="#2a8f4c"></stop>
        <stop offset="1" stop-color="#15602f"></stop>
      </linearGradient>

      <!-- ============ MYKHET SOM LYS, IKKE SOM EFFEKT ==================
           En form er myk fordi den er RUND og lyset faller på den — ikke
           fordi den har fått et slørfilter. Uskarpheten her er liten (1,0 på
           en 100-enheters flate) og gjør bare det en malt kant gjør: slutter
           uten å kutte. Skru den opp, og figuren blir en glødeeffekt.

           `feDisplacementMap`-rufsen som lå her er FJERNET. Den etterlignet
           at Arvinds skisse er tegnet fort, og det er en begrensning ved
           skissen — ikke stilen. Ikonet er utført godt, og det er ikonet som
           setter nivået. -->
      <filter id="mykkant" x="-25%" y="-25%" width="150%" height="150%">
        <feGaussianBlur stdDeviation="1"></feGaussianBlur>
      </filter>
      <!-- Den diffuse gløden rundt STJERNA. Den er den ENESTE formen som
           gløder, og det er med vilje: i ikonet lyser stjerna, mens
           kortfargene bare er belyst. Gløder alt, betyr gløden ingenting. -->
      <filter id="diffus" x="-70%" y="-70%" width="240%" height="240%">
        <feGaussianBlur stdDeviation="6.5"></feGaussianBlur>
      </filter>
      <filter id="uskarpstripe" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="1.1"></feGaussianBlur>
      </filter>

      <pattern id="flaggstriper" width="100" height="13.4" patternUnits="userSpaceOnUse">
        <rect width="100" height="6.7" fill="#e8503f"></rect>
        <rect y="6.7" width="100" height="6.7" fill="#f9f7f0"></rect>
      </pattern>
      <!-- STJERNA slik den FAKTISK er i ikonet: stripene har nesten uskarpe
           overganger, og rundt ligger en lys blå glød som siver utover. Ingen
           strek, ingen neonrør — bare en uskarp kopi av formen bak den. -->
      <path id="stjerneform"
            d="M50 3 L61.5 34.3 L95.2 35.6 L68.5 55.9 L78 88.5 L50 69.4 L22 88.5 L31.5 55.9 L4.8 35.6 L38.5 34.3 Z"></path>
      <g id="stjernemerke">
        <use href="#stjerneform" fill="#7fb2ff" filter="url(#diffus)" opacity=".9"></use>
        <use href="#stjerneform" fill="#cfe2ff" filter="url(#uskarpstripe)"></use>
        <use href="#stjerneform" fill="url(#flaggstriper)" filter="url(#uskarpstripe)"></use>
      </g>

      <!-- ============ KORTFARGENE, MYKE OG UTEN KONTUR ================
           Brukes STORT midt på kortflaten. Hjørneindeksen beholder den flate
           glyffen i blekkfargen: en uskarp gradient på 12 piksler blir grøt,
           og det er hjørnet som bærer lesbarheten når hånden ligger i vifte.
           Det er også dét som gjør at airbrushen ikke koster kontrast. -->
      <g id="kf-S" filter="url(#mykkant)">
        <path d="M50 8C38 26 14 38 14 56c0 12 9 20 20 20 6 0 11-3 14-7-1 12-5 19-11 23h26c-6-4-10-11-11-23 3 4 8 7 14 7 11 0 20-8 20-20 0-18-24-30-36-48Z"
              fill="url(#g-koks)"></path>
      </g>
      <g id="kf-H" filter="url(#mykkant)">
        <path d="M50 90C28 74 10 60 10 42 10 28 20 19 32 19c8 0 14 4 18 10 4-6 10-10 18-10 12 0 22 9 22 23 0 18-18 32-40 48Z"
              fill="url(#g-korall)"></path>
      </g>

/* ======================= UTRULLINGSLÅSEN ==================================

   HVA SOM VAR GALT, OG HVORFOR INGEN SÅ DET

   Her sto én linje: en `script`-tagg med `src` hardkodet til
   `https://arvindfroi--…web.val.run/app.js`.

   ble rapportert — den blå Americana-identiteten var på plass, mens dama
   fortsatt sto som «D» og stikkvinneren ikke ble vist. Begge deler VAR rettet

   Ingenting sa fra. Bundelen svarer dessuten `Cache-Control: max-age=300`
   uten `ETag`, så en fane som står åpen henter den ikke på nytt i det hele
   tatt.

   1. Det LOKALE bygget prøves først. Da ser man faktisk det man nettopp
      bygde, og «virker det?» er et spørsmål man kan svare på lokalt.
   2. Feiler det, hentes den utrullede bundelen — med versjonen i URL-en, slik
      at en ny utrulling faktisk når fram gjennom hurtigbufferen.
   3. Uansett utfall SAMMENLIGNES versjonen siden venter med den bundelen
      melder. Er de ulike, står det på skjermen. En stille uoverensstemmelse
      mellom to artefakter er den feilklassen dette prosjektet har blitt tatt
      av flest ganger; her får den en høyttaler.

   Val Town svarer 200 med HTML på filer som ikke finnes, så «lastet» er ikke
   det samme som «kjørte». Derfor er testen at bundelen faktisk MELDER en
   versjon — ikke at `onload` fyrte.                                       */

(function () {

  /* Bumpes sammen med `BUNDELVERSJON` i `web/app.ts`. Står de ulikt, sier
     siden fra i stedet for å vise en halvgammel utgave i stillhet. */
  var VENTET = "v7-2026-08-10";
  var BASE = "https://arvindfroi--eb370dc886d311f1abd41607ee4eb77e.web.val.run/";

  function varsle(tekst) {
    var d = document.createElement("div");
    d.id = "versjonsvarsel";
    d.setAttribute("role", "alert");
    d.textContent = tekst;
    document.body.appendChild(d);

  function last(url, reserve) {
    var s = document.createElement("script");
    s.src = url;
    s.onload = function () { etterpå(url, reserve); };
    s.onerror = function () { etterpå(url, reserve); };

  function etterpå(url, reserve) {
    var fikk = window.AMERIKANEREN_VERSJON;

    varsle(
